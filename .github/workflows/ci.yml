name: CI

# `pnpm verify` on pre-push is the primary gate — it runs on the developer's
# machine, in seconds, before anything leaves it. This workflow exists for the
# two things a laptop cannot do well: prove the gate passes on a clean checkout
# with no local state, and run the end-to-end suite against a real production
# build, which is too slow to sit in front of every push.

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck · lint · format · qa · test · contract:check · build
      - run: pnpm verify
        env:
          # The contract check needs gh to reach yuvoy-api. Without a token it
          # warns and passes rather than failing the build on network access —
          # see scripts/check-contract-drift.mjs.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium

      # Builds and serves internally. Mocks stay ON: there is no staging API,
      # and pointing e2e at production would create real reservations against
      # real inventory.
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

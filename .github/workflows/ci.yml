name: CI

# Runs on every pull request into `main` or `dev`, and by hand.
#
# The `main` and `dev` rulesets require `verify` to pass before a pull
# request can merge (yuvoy-mobile#403, decision D-052). On `dev` the branch
# must also be up to date with `dev`. On `main` that setting is off: release
# merge commits never go back into `dev`, so every release PR would read as
# behind. `main` deploys to production on every push, so this is the check
# standing between a merge and the live site.
#
# This was manual only from 14 Aug 2026, to save Actions minutes. That budget
# belongs to the org's private repositories: this repository is public, so its
# GitHub-hosted runs cost nothing. The pre-push hook (`pnpm verify`) still runs
# the same suite before anything leaves the machine; this is the second opinion
# on a machine that is not the author's.
#
# The performance budgets job runs only by hand (`inputs.lighthouse` is empty
# on a pull request): it needs a consistent machine to mean anything.
#
#     gh workflow run CI --ref <branch>
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      lighthouse:
        description: Also run the performance budgets
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # The e2e server reads the mock settings from `.env.local`. A fresh
      # checkout has none, so every server-side call went to an address that
      # did not answer and the suite timed out (yuvoy-mobile#403, 29 Oct).
      # `.env.example` holds the mock values and no secrets.
      - run: cp .env.example .env.local

      # typecheck · lint · format · qa · test · contract:check · build · e2e
      - run: pnpm verify
        env:
          # The contract check needs gh to reach yuvoy-api. Without a token it
          # warns and passes rather than failing on network access.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: performance budgets
    if: ${{ inputs.lighthouse }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Mocked, so the budgets measure OUR bytes rather than the API's latency.
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_MOCKING: enabled

      - run: pnpm dlx @lhci/cli@0.14.x autorun
        env:
          NEXT_PUBLIC_API_MOCKING: enabled

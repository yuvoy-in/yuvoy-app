# app.yuvoy.in: a MANUAL redeploy, and nothing else.
#
# Vercel's Git integration deploys `main` on every push (connected 20 Sep
# 2026), so this workflow no longer runs on push. For four days it did both:
# every release deployed production twice, the two builds raced for the
# domain, and this one, built with no `.git`, stamped the service worker with
# an empty version (see src/lib/site/sw-version.ts). The audit that used to
# follow this deploy now follows Vercel's: audit-after-deploy.yml.
#
# There is ONE Vercel project for now (owner decision, 1 Sep 2026), so `main`
# is the only branch that deploys and `dev` deploys nowhere.
name: Production deployment

on:
  # Manual redeploy. NEXT_PUBLIC_* values are inlined at BUILD time, so
  # changing one in Vercel does nothing until a rebuild. Vercel's own
  # Redeploy button does the same job; this one also runs the audit.
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # A deploy that succeeds is not a deploy that works. Half of what the audit
  # checks — robots.txt agreeing with the meta tag, the sitemap resolving, the
  # share image serving — depends on values that exist only in the Vercel
  # dashboard, and a green build says nothing about any of them. That gap cost
  # three deploys to find once.
  audit:
    needs: deploy
    uses: ./.github/workflows/audit.yml

openapi: 3.1.0
info:
  title: Yuvoy API
  # 1.0.0: the catalog shapes are now implemented rather than proposed. This
  # release is breaking against 0.0.0-proposal — ratings and review counts are
  # gone (no real reviews exist, and a number nobody earned is a fabricated
  # claim), Media became a playback object, and Slot carries local time and
  # freshness. There are no live consumers of those shapes.
  version: 1.1.0
  description: >
    The Experience Commerce API consumed by yuvoy-web (and, later, the mobile
    app). This document is the FE/BE contract and the source of truth: the copy
    in `yuvoy-api` is canonical, the copy in `yuvoy-web` is a mirror.

    Conventions: money is an integer minor unit + currency; timestamps are
    ISO-8601 UTC; lists use cursor pagination; money-mutating requests require an
    `Idempotency-Key`; errors use a single envelope `{ error: { code, message, details, requestId } }`.

    Two rules this API holds to, visible in the shapes below. Nothing is
    published that is not backed by a record — there are no ratings, no review
    counts and no placeholder prices, because a number nobody earned is a
    fabricated claim. And availability is only ever what Yuvoy itself has
    recorded and recently verified: a `request`-mode slot carries no seat count
    at all, because Yuvoy holds no inventory on it.
servers:
  - url: https://api.yuvoy.in/v1
    description: Production
  - url: https://dev.api.yuvoy.in/v1
    description: >-
      Development. A second App Runner service with its own database, seeded
      fixtures and the FAKE payment provider — so checkout, capture, refunds and
      cancellation can be exercised end to end without a merchant account and
      without consuming real seats.


      It is called DEV and not staging on purpose. Staging implies a rehearsal
      of production — same shape, same data, a place you trust a green run. This
      is not that: the catalog is fixtures, the database is resettable, and it
      exists to be broken. A green run here means the wiring works, never that a
      release is safe.
  - url: http://localhost:8099/v1
    description: >-
      Local development. `scripts/dev-stack.sh` brings this up with seeded data,
      the fake payment provider and OTP codes in the response, so every flow is
      exercisable without a Razorpay account or an SMS provider.
tags:
  - name: auth
  - name: experiences
  - name: bookings
  - name: leads
  - name: messages
  - name: waitlist
  - name: me
  - name: operators
    description: >
      Supply-side entry points that need no account, because the person using
      them does not have one yet.

security: []

paths:
  /leads:
    post:
      tags: [leads]
      summary: Register pre-launch interest as a traveller or a provider
      description: >
        Public, rate-limited pre-launch lead capture. The request is
        discriminated on `audience`. Geography is generic: `marketKey` names a
        launch market and destination keys name a destination within it, so
        future markets reuse this shape unchanged.


        A returning contact (same audience + normalised WhatsApp) updates its
        current preferences and attribution and returns `200`; a new contact
        returns `201`. Notification jobs are written in the same transaction as
        the lead, so a saved lead is never lost to an unavailable alert target.
      operationId: createLead
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadInput" }
      responses:
        "201":
          description: New lead recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadAcceptance" }
        "200":
          description: Existing lead updated (same audience + WhatsApp)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadAcceptance" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /messages:
    post:
      tags: [messages]
      summary: Send a message from the public contact form
      description: >
        Public, rate-limited contact form. Where `/leads` asks a visitor for
        their details, this lets them say something — the questions a
        pre-launch product gets and otherwise has nowhere to receive.


        Deliberately not a lead: a message carries no marketing opt-in and
        never joins a marketing list. It is used to answer the sender, and
        nothing else.


        Always `202`, never `201`: the response acknowledges receipt and
        promises nothing about a reply, because the site publishes no reply
        time. Notification jobs are written in the same transaction as the
        message, so a stored message is never lost to an unavailable alert
        target.
      operationId: createMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageInput" }
      responses:
        "202":
          description: >
            Message received. Also returned for a submission caught by the
            honeypot, which is acknowledged normally and then discarded — a
            bot must not be able to tell that it was detected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageAcceptance" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /search:
    get:
      tags: [experiences]
      summary: Find something to do
      description: >
        Full-text over the words a traveller would actually type — the title,
        the destination, the category, the summary.


        **Not the operator's name.** Searching by business is a supply-side
        question, and surfacing it here would be the one place ranking could
        express a preference between operators, which nothing else in this API
        can do. Ordering is relevance then recency, with no operator term.


        Its own route rather than a `q` on the feed: the feed is ordered by
        recency and is the browsing surface, search is ordered by relevance and
        is the finding surface. One endpoint doing both means one of the two
        orderings is always wrong and the client cannot tell which it got.


        An empty `q` **with no filters** returns nothing, not everything —
        "everything" is what the feed is for, and a search box that shows the
        whole catalog when you clear it looks broken.


        An empty `q` **with any filter set** returns that filtered set, ordered
        by recency. A traveller who taps Havelock and types nothing is not
        asking for everything, they are asking for Havelock, and answering that
        with a blank screen makes every chip look like a control that does
        nothing. Text and filters are independent; either alone is a real
        search, and together they intersect.


        Not paginated: a traveller who does not find it in twenty results
        changes the words rather than paging.
      operationId: searchExperiences
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - name: destinationKey
          in: query
          schema: { $ref: "#/components/schemas/DestinationKey" }
        - name: category
          in: query
          description: >-
            The closed browse vocabulary. **An unknown value is a `400`**, not
            an empty page — the two are indistinguishable to a client
            otherwise, and "no results" is the wrong thing to tell somebody
            whose filter was never going to match: they change the words
            instead of the spelling.
          schema: { $ref: "#/components/schemas/Category" }
        - name: activityType
          in: query
          description: >-
            What the thing actually is — `scuba`, not `adventure`. Matched
            exactly.


            **An unknown value is an empty page, not a `400`** — the opposite of
            `category`, and deliberately. This set grows by `INSERT`, so today's
            unknown value is tomorrow's real one and refusing it would make the
            API stale between deploys. Read the current set from
            `GET /catalog/vocabulary` rather than hardcoding it.
          schema: { type: string, maxLength: 60 }
        - name: bookableOn
          in: query
          schema: { type: string, format: date }
          description: Only what can actually be booked that day, in the market's timezone.
      responses:
        "200":
          description: Matches, most relevant first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExperiencePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }

  /operator-applications:
    post:
      tags: [operators]
      summary: Apply to run experiences on Yuvoy
      description: >
        A business asking to join. Public and unauthenticated, because there is
        no account yet — that is the point.


        This creates an application, **not an operator**. An application is a
        claim somebody typed into a form; an operator is a business we have
        checked, whose credentials we hold and whose departures the catalog
        joins against. Nothing here can put an experience in front of a
        traveller.


        Deliberately forgiving about everything except the three fields needed
        to have a conversation — the business, a person, and a number that can
        be dialled. A form that rejects a boat owner for omitting a destination
        key loses supply in a market where supply is the constraint.


        The response carries no identifier: there is nothing a stranger could do
        with one, and handing out ids for rows in a review queue is one more
        authorization boundary to get right later.


        `next` points the applicant at self-service signup rather than promising
        a call. It used to say somebody would ring within two working days, and
        nothing kept that promise — the operators who submitted this form in
        August 2026 were still waiting a month later. `POST
        /operator/v1/auth/signup` is open to them right now, the account it
        creates is PROSPECT and cannot be booked, and document verification is
        still the gate — so both halves of the new sentence are things the
        system actually does.
      operationId: submitOperatorApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessName, contactName, phone]
              properties:
                businessName: { type: string, minLength: 2, maxLength: 200 }
                contactName:  { type: string, minLength: 2, maxLength: 120 }
                phone:
                  type: string
                  description: E.164, with the country code.
                email:       { type: string }
                market:      { type: string }
                destination: { type: string }
                about:       { type: string, maxLength: 2000 }
                operations:  { type: string, maxLength: 1000 }
                source:      { type: string, description: Where they heard about us. }
                privacyAccepted:
                  type: boolean
                  description: >-
                    Send `true` and this call **also records the marketing lead
                    and its consent, in the same transaction as the
                    application**. One call, one unit of work: either both rows
                    exist and are linked, or neither does.


                    **Optional, and absent is not `false`.** Omitting it writes
                    the application alone and behaves exactly as this endpoint
                    always has, so a deployed form does not start failing
                    because we grew a field. Sending `false` is a person
                    declining, and is refused with `400` rather than filed —
                    recording a marketing contact for somebody who declined is
                    the one outcome this must not produce.


                    Until yuvoy-web sends this, the site calls `/leads`
                    separately. That works and is what it does today; it is
                    simply two independent writes that can half-succeed, and
                    the failure that matters is an application with no consent
                    row on a site whose privacy policy says we hold one.
                marketingOptIn:
                  type: boolean
                  description: >-
                    Only meaningful alongside `privacyAccepted`. Defaults false.
                utm:
                  allOf:
                    - $ref: "#/components/schemas/Utm"
                  description: >-
                    Campaign attribution for the lead. Ignored unless
                    `privacyAccepted` is sent, because without consent there is
                    no lead to attribute.
      responses:
        "202":
          description: Recorded. `next` tells them how to start without waiting for us.
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
                  next:     { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /waitlist:
    post:
      tags: [waitlist]
      summary: Join the launch waitlist
      operationId: joinWaitlist
      deprecated: true
      description: >-
        Retired. Superseded by POST /leads, which captures the same intent with
        audience, attribution and consent. Never implemented; returns 501.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaitlistInput" }
      responses:
        "501":
          description: >-
            Not implemented, and deprecated. Declared rather than omitted: this
            is what the route actually answers, and a contract that promises a
            201 it never sends is worse than one that admits the stub.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "201":
          description: Added (idempotent on email)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitlistEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /catalog/index:
    get:
      tags: [catalog]
      summary: Everything that has a public page, and when it last changed
      operationId: getCatalogIndex
      description: >-
        The data a sitemap is built from. **Not the sitemap** — the site's URL
        structure belongs to the site, and returning `/experiences/<slug>` here
        would mean a URL change needing a backend deploy, in the one repository
        nobody editing the site opens.


        The only catalog response that is genuinely edge-cacheable, because
        nothing in it moves without a person editing a listing. No seat counts,
        no prices, no availability beyond a boolean.


        `lastModified` is when the CONTENT changed, not when availability did. A
        crawler told a page changed every time a seat is booked learns to ignore
        the signal, which costs the pages that genuinely did change.


        For a destination or market it is the newest change among the published
        experiences on it: a destination page whose own row has not been touched
        since March is not unchanged if three listings appeared last week.
      responses:
        "200":
          description: Every public page. Published experiences only.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      required: [kind, slug, lastModified, hasBookableDates]
                      properties:
                        kind:
                          type: string
                          enum: [experience, destination, market]
                        slug: { type: string }
                        marketKey: { type: string }
                        destinationKey: { type: string }
                        lastModified: { type: string, format: date-time }
                        hasBookableDates:
                          type: boolean
                          description: >-
                            Whether anything is currently sellable. A page with
                            nothing bookable is still worth indexing — the
                            season starts again — but the site may render it
                            differently, and finding out should not cost a
                            query per URL.
        "503": { $ref: "#/components/responses/CatalogUnavailable" }

  /catalog/vocabulary:
    get:
      tags: [catalog]
      summary: What the filter chips may offer
      operationId: getPublicVocabulary
      description: >-
        The words for `category`, `activityType` and `destinationKey` on
        `/search` and `/reels`: every category, the activity types, and the
        destinations that are open. No session. Build chips from this rather
        than from a hardcoded list, which disagrees with us the day a
        destination opens.


        **The active vocabulary, not the populated one.** A value with no
        published listing behind it today is still offered; filtering by it
        answers an empty page. Narrowing to populated values would make a chip
        vanish when its only listing pauses for a week and reappear when it
        comes back.


        `marketKey` narrows destinations and activity types to one market.
        Without it, destinations are those of every open market and activity
        types are the whole list. A well-formed market we do not have, or have
        not opened, answers categories and two empty lists rather than an
        error; a malformed one is a `400`.


        Edge-cacheable: nothing here moves with a booking.
      parameters:
        - name: marketKey
          in: query
          schema: { $ref: "#/components/schemas/MarketKey" }
      responses:
        "200":
          description: The vocabulary.
          content:
            application/json:
              schema:
                type: object
                required: [categories, activityTypes, destinations]
                properties:
                  categories:
                    type: array
                    description: Every category, in the order chips should show them.
                    items: { $ref: "#/components/schemas/VocabularyTerm" }
                  activityTypes:
                    type: array
                    description: >-
                      Each with the category it belongs to, so chips can be
                      narrowed to the chosen category. Not an enum anywhere in
                      this contract: the set grows by INSERT.
                    items: { $ref: "#/components/schemas/ActivityTypeTerm" }
                  destinations:
                    type: array
                    description: >-
                      Open destinations, ordered by market and then as supply
                      wants them shown. `key` is `<market>/<destination>`.
                    items: { $ref: "#/components/schemas/VocabularyTerm" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }

  /scans:
    post:
      tags: [scans]
      summary: Record a scan of a printed code
      operationId: recordScan
      description: >-
        Somebody pointed a phone at a QR code on a boat, a card in a guesthouse,
        a sticker on a dive shop's door.


        **This endpoint sets no cookie and stores nothing identifying.** No
        device id, no IP, no user agent — the user agent is used to decide
        "person or crawler" and is then discarded in the same statement. That is
        the endpoint, not an omission: counting scans without an identifier is
        what keeps this an aggregate counter rather than personal data, and it
        is why there is no consent banner between a traveller and a QR code on a
        jetty. A client that adds its own identifier to the body defeats the
        design; there is no field for one.


        `target` is always populated, including for a code that resolves to
        nothing — an unknown or retired code lands on the market feed rather
        than an error page. Somebody standing on a pier holding a scuffed card
        did nothing wrong, and a 404 there is a dead end with no staff nearby.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  pattern: "^[A-Za-z0-9-]{3,32}$"
                  description: >-
                    The code as printed. Short and human-readable because
                    somebody reads it aloud over a phone when a QR is scuffed.
                  example: HAVELOCK-DIVE-01
      responses:
        "200":
          description: >-
            Counted, and here is where to go. Always 200, including for an
            unknown code: the response is a destination, and the person holding
            the card needs one either way.
          content:
            application/json:
              schema:
                type: object
                required: [target, known]
                properties:
                  target:
                    type: string
                    description: Path to send the traveller to.
                    example: /e/scuba-discover-havelock
                  known:
                    type: boolean
                    description: >-
                      Whether the code resolved. `false` still carries a usable
                      target.
                  experienceId: { type: string, format: uuid }
                  marketKey: { type: string, example: andaman }
                  destinationKey:
                    allOf:
                      - $ref: "#/components/schemas/DestinationKey"
                    description: >-
                      Where the code is, when it is registered against a
                      destination rather than the market as a whole. A jetty
                      card in Havelock carries `andaman/havelock`.


                      **Absent when the code names no destination**, and absent
                      for an unknown code. It is not a filter the client has to
                      apply: it is what the client needs in order to open the
                      feed or search on the place the person is standing in,
                      rather than on the whole market.


                      This has always been on the `scan_codes` row and has
                      always been written to the analytics table. It was simply
                      not returned, so a jetty card in Havelock and a hotel card
                      in Port Blair sent two travellers to the identical
                      unfiltered feed.
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /reels:
    get:
      tags: [catalog]
      summary: The feed
      description: >
        **Every published reel**, not one per listing. A listing may hold twenty
        clips; before this only its hero was visible without opening it, which
        made the product read as a catalogue with a picture on each row rather
        than as a feed.


        Each item carries the whole listing, so a card can offer the booking
        without a second request — a spinner over the price is a spinner over
        the one thing somebody stopped scrolling for.


        **Ordering interleaves operators.** Reels are numbered within each
        business and the feed is ordered by that number, so every operator's
        first reel precedes anybody's second. A business with twenty clips
        appears across twenty rounds rather than twenty times in a row. The
        ordering is blind to which operator: it rotates them, and cannot express
        a preference for one. Stable between requests.


        **Paged, and it says whether it ended.** Pass `nextCursor` back to
        continue; its absence, with `complete: true`, is the end. Do not infer
        the end from a short page — a page that happens to come back exactly
        full would stop the scroll early, and an infinite scroll that has
        silently stopped looks identical to one with nothing more to show, so
        nobody reports it.


        The cursor resumes inside the rotation rather than at a timestamp, which
        is why a client must not attempt to page this ordering itself: restart
        the rotation and one business's second reel arrives before another's
        first, and the ordering stops being blind to which operator.


        **Filters.** `q`, `destinationKey`, `category`, `activityType` and
        `bookableOn` narrow the feed with the same meaning and the same
        validation as `GET /search`: an unknown `category` is a `400`, an
        unknown `activityType` is an empty page, and a `q` with nothing
        searchable in it (only punctuation, or only exclusions) is an empty
        page rather than the words being ignored. Omit all of them and this is
        the unfiltered feed, unchanged.


        Filters **narrow, they never rank**. The order is still the rotation,
        counted within the filtered set, so under "scuba at Havelock" every
        business's first matching reel still comes before anybody's second.
        There is no relevance ordering here; that is what `/search` is for.


        **A cursor belongs to the filters it was minted under.** Sending it
        with any different filter set is a `400`, because the rotation is
        counted within the filters and the same position means a different
        card under different ones. When the chips change, drop the cursor and
        start from the first page. The same words typed with different case or
        spacing are the same filter set. Unfiltered cursors are unchanged from
        before filters existed.


        The order is stable between requests, so a grid can open a reel and
        swipe on through the same sequence by paging with the same filters.
        As with the unfiltered feed, a listing published, withdrawn or sold out
        (under `bookableOn`) between two pages can move later cards by a place.
      operationId: listReels
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 60, default: 30 }
        - name: cursor
          in: query
          description: >-
            From a previous response's `nextCursor`, sent with exactly the same
            filters as that request. Opaque; do not construct one.
          schema: { type: string }
        - name: q
          in: query
          description: Free text, as on `/search`. Narrows; does not reorder.
          schema: { type: string, maxLength: 120 }
        - name: destinationKey
          in: query
          schema: { $ref: "#/components/schemas/DestinationKey" }
        - name: category
          in: query
          description: As on `/search`. **An unknown value is a `400`.**
          schema: { $ref: "#/components/schemas/Category" }
        - name: activityType
          in: query
          description: >-
            As on `/search`. Matched exactly; an unknown value is an empty page,
            not a `400`. The current set is in `GET /catalog/vocabulary`.
          schema: { type: string, maxLength: 60 }
        - name: bookableOn
          in: query
          schema: { type: string, format: date }
          description: >-
            Only reels of listings that can actually be booked that day, in the
            market's timezone.
      responses:
        "200":
          description: Reels, each with the listing it sells.
          content:
            application/json:
              schema:
                type: object
                required: [items, complete]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        media: { $ref: "#/components/schemas/Media" }
                        experience: { $ref: "#/components/schemas/ExperienceSummary" }
                  complete:
                    type: boolean
                    description: >-
                      Told rather than inferred. `false` with no `nextCursor`
                      means the server stopped, which is a different thing from
                      the feed having ended.
                  nextCursor:
                    type: string
                    description: Absent when there is nothing after this page.
        "400": { $ref: "#/components/responses/BadRequest" }

  /reels/{id}:
    get:
      tags: [catalog]
      summary: One reel, by its own link
      description: >
        A shared reel opens the reel, not the listing it belongs to.


        `id` is the `media.id` every feed card already carries, so a client
        builds the link from data it has. The response is the same item the
        feed returns, `{ media, experience }`, so the card renders with the
        same component.


        **Only reels the feed would show.** The same visibility rule as
        `GET /reels`: the clip is published and ready, the provider has made it
        public, and its listing can be sold today. Anything else is a `404`,
        and a reel that was hidden and one that never existed are
        deliberately the same answer, as for a draft listing. A malformed id is
        also a `404`: it is usually a link that was cut short.


        This returns the reel alone. To swipe on from it, page `GET /reels`
        as usual.
      operationId: getReel
      parameters:
        - name: id
          in: path
          required: true
          description: The feed card's `media.id`.
          schema: { type: string }
      responses:
        "200":
          description: The reel, with the listing it sells.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReelItem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }

  /experiences:
    get:
      tags: [experiences]
      summary: List published experiences
      description: >-
        The browse surface, ordered by recency and cursor-paged. Use `/search`
        to find something; this is for looking.


        **`mode` and `q` used to be documented here and were never
        implemented** — the handler has never read either, so a client sending
        them got them silently ignored, and one sending `q` got an unfiltered
        list back believing it had searched. They are removed rather than
        implemented: relevance ordering belongs on `/search`, and one endpoint
        doing both means one of the two orderings is always wrong and the
        client cannot tell which it got.


        `destinationKey` and `bookableOn` are the reverse — implemented from
        the beginning and never documented, so a client built from this file
        could not know they existed. Now written down.
      operationId: listExperiences
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: destinationKey
          in: query
          schema: { $ref: "#/components/schemas/DestinationKey" }
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/Category" }
        - name: bookableOn
          in: query
          description: Only what can actually be booked that day, in the market's timezone.
          schema: { type: string, format: date }
      responses:
        "200":
          description: A page of experience summaries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExperiencePage" }

  /experiences/{slug}:
    get:
      tags: [experiences]
      summary: Get a single experience by slug
      operationId: getExperience
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The experience
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experience" }
        "404": { $ref: "#/components/responses/NotFound" }

  /experiences/{slug}/availability:
    get:
      tags: [experiences]
      summary: Bookable slots within a date range
      operationId: getAvailability
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: from
          in: query
          required: true
          description: >-
            Market-local date, inclusive. Interpreted in the experience's market
            timezone, not the caller's and not UTC — "the 9th" means the 9th
            where the boat leaves from.
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          description: Market-local date, inclusive.
          schema: { type: string, format: date }
      responses:
        "200":
          description: >-
            Slots in the requested local-date range, with the freshness of the
            answer. Stale slots are counted rather than silently omitted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailabilityPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reservations:
    post:
      tags: [bookings]
      summary: Hold seats, or ask the operator for them
      description: >
        Checkout. Unauthenticated by design — the traveller is a stranger with a
        phone, and a login wall here is the largest drop-off available in the
        flow.


        Two behaviours, decided by the slot's `bookingMode`. An `allotment` slot
        holds seats immediately and returns `state: active` with a
        `holdExpiresAt`. A `request` slot creates `state: pending_request` with a
        `requestExpiresAt` and holds no seat at all — Yuvoy has no inventory on
        it until the operator accepts.


        A request is taken at any hour and however many are already waiting on
        the departure. It stays open until the operator answers or booking for
        the departure closes, so `requestExpiresAt` is the departure's booking
        cutoff, not a short answer clock. Capacity is checked when the operator
        accepts, not here.


        `Idempotency-Key` is required. A retry with the same key returns the
        original response, unchanged, with `201` and `Idempotent-Replay: true` —
        the status code is part of the stored response, so a client that retried
        after a dropped connection cannot tell its request was a repeat. The same
        key with a *different* body is refused: replaying it would hand back a
        reservation the caller never asked for.


        `statusToken` is returned exactly once, here. Only its hash is stored, so
        it cannot be recovered afterwards — including by us. It belongs in a URL
        fragment, never a path or query.


        **Signed in (optional, since 2026-09-13).** Send `Authorization: Bearer
        <travellerSession>` (a recovery token also counts; a `statusToken` does
        not) and the checkout is the traveller's own:

          - `contact.whatsapp` may be left out, and is **ignored if sent**. The
            booking goes on the number the session proved. A typed number would
            put the booking on a number nobody proved, and it would appear in
            that number's account.
          - `contact.name` may be left out. The profile name is used, else the
            name on the newest booking made with the number. With neither, `400`
            with `details["contact.name"]`.
          - `contact.email` stays optional; left out, the profile email is used
            when there is one.
          - Anything sent in `name` or `email` is used as sent.

        A Bearer credential that is not a live sign-in (expired, signed out,
        unknown, or a booking's status token) is `401 unauthorized`, never a
        guest checkout: sign in again, or retry without the header. With no
        `Authorization` header, checkout is exactly the guest checkout above.
      operationId: createReservation
      security: [{}, { travellerSession: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated, 16-128 chars of `A-Za-z0-9_.:-`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReservationInput" }
      responses:
        "201":
          description: Seats held, or the request lodged with the operator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: >
            A Bearer credential was sent and is not a live sign-in. Only ever
            answered to a request that sent `Authorization`; a guest checkout
            never sees it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Could not proceed, and the code says why: `capacity_unavailable`,
            `cutoff_passed`, `idempotency_key_reuse`, `idempotency_in_progress`.
            `request_quota_exhausted` and `request_window_closed` are no longer
            returned (since 2026-09-13): every request is taken.


            `answers_required`: the body sent `answers`, even an empty list, and
            a question the listing asks now with `required: true` has no answer
            in it that fits. `details.questions` names each such question as an
            object with `questionId` and `text`, in the listing's order. Nothing
            was held, and the same `Idempotency-Key` can be sent again with the
            answers. A body without `answers` is never refused this way.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: >
            Deliberately stopped, not broken — `booking_disabled` or
            `operator_not_bookable`. Distinct from an outage so the client can
            say something true.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /reservations/{id}/release:
    post:
      tags: [bookings]
      summary: Give up a held reservation
      description: Idempotent — releasing an already-released hold is not an error.
      operationId: releaseReservation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: "Released, or already was." }
        "404": { $ref: "#/components/responses/NotFound" }

  /reservations/{id}/payment-order:
    post:
      tags: [bookings]
      summary: Open checkout for a held reservation
      description: >
        Returns the payment order to hand to the provider's checkout.


        **No `Idempotency-Key`, and that is not an omission.** One reservation
        has at most one payment order by construction, so asking twice returns
        the same order — stronger than a key the client has to remember to send,
        and it matters more here than anywhere else: two orders for one
        reservation is a traveller who can pay twice for the same seats.


        Only a live hold can be paid for. A lapsed hold, a released reservation
        and an experience with no contracted price all answer
        `reservation_not_payable`: they differ to us and not to the traveller,
        whose next step is the same in every case.
      operationId: createPaymentOrder
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: >-
            **Payment is not open yet** (D-021 — no processor chosen). A
            deliberate product state, not a failure: the hold is real and still
            running, so keep showing the countdown. Render `message` and do not
            treat this as an error.
          content:
            application/json:
              schema:
                type: object
                required: [state, message]
                properties:
                  state: { type: string, enum: [coming_soon] }
                  message: { type: string }
                  holdStillActive: { type: boolean }
                  payAtCounter:
                    description: >-
                      Where to finish instead. While no card processor is live
                      this is the ONLY way a booking can be completed, so a
                      client that renders `message` and stops leaves the
                      traveller unable to book at all.
                    type: object
                    required: [available, confirmAt]
                    properties:
                      available: { type: boolean }
                      confirmAt:
                        type: string
                        description: >-
                          Path to POST to, relative to the API base — the same
                          path as `POST /reservations/{id}/cash-booking`, so it
                          carries no `/v1` of its own.
        "201":
          description: The order to pay against.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentOrder" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The hold has ended; this reservation can no longer be paid for.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /operators/{slug}:
    get:
      tags: [catalog]
      summary: A business, everything it sells, and its reels
      description: >
        The page behind the name on a reel. Tapping a reel opens its listing;
        tapping the operator on that listing had nowhere to go, so every
        business in the catalog was a name and a logo, and the other clips they
        had shot were reachable only by scrolling the whole feed until one came
        round again.


        **One request for the whole first paint** — who they are, what they
        sell, and the first screen of reels. Page the grid beyond that with
        `/operators/{slug}/reels`.


        **There are no followers and no rating.** Reviews do not exist until
        real completed bookings produce them, and a number nobody earned is a
        fabricated claim. Nothing here counts anything a person could inflate.


        **`bookable` is per listing as well as for the business**, and the page
        answers for a business that has paused rather than 404-ing — somebody
        was sent this link an hour ago and is looking for a specific thing they
        saw. A business that has never published anything has no page.
      operationId: getOperator
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The business.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorProfile" }
        "404": { $ref: "#/components/responses/NotFound" }

  /operators/{slug}/reels:
    get:
      tags: [catalog]
      summary: The rest of a business's reels
      description: >
        Newest first, which is **not** the main feed's ordering. The feed
        rotates operators so no business owns the scroll; on one business's own
        page that rotation has a single member and means nothing, and what
        somebody opening a portfolio wants is the most recent work first.


        Paged, and it says whether it ended. Pass `nextCursor` back; its absence
        with `complete: true` is the end. Do not infer the end from a short
        page.
      operationId: listOperatorReels
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 60, default: 30 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: One page of the grid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReelPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reservations/{id}/cash-booking:
    post:
      tags: [bookings]
      summary: Confirm a held reservation, to be paid in cash on the day
      description: >
        The traveller commits now and pays the operator at the counter. The
        booking is real from this moment — it holds the seat, appears on the
        operator's manifest and can be cancelled like any other. The only thing
        not yet true is that anybody has been paid.


        **Cash is not a synthetic payment.** We never touch the money, so
        `capturedAmountPaise` on this booking stays `0` for its whole life and
        the commission becomes something the operator owes us, settled outside
        the payout run. Nothing about this booking claims we hold funds.


        **No `Idempotency-Key`, and that is not an omission.** One reservation
        has at most one booking by construction, so asking twice returns the
        booking the first ask made — with `200` rather than `201`, because
        nothing was created the second time. This matters more here than
        anywhere: two bookings for one reservation is one seat sold twice.


        The price is the one agreed at checkout, never a fresh read of the
        listing: an operator editing their price this afternoon must not change
        what somebody agreed to this morning.
      operationId: confirmCashBooking
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: The booking. Show the reference and what to bring.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashBooking" }
        "200":
          description: >-
            This reservation was already confirmed — the second tap on bad
            signal. The same booking, not a new one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashBooking" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            The seats are no longer held, or a card payment is already open for
            them. Either way the traveller starts again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: We have stopped selling this operator's departures.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /bookings/recovery/request:
    post:
      tags: [bookings]
      summary: Ask for a new booking link
      description: >
        For a traveller who lost their link. A phone number is not a secret — it
        is on the operator's manifest, in a WhatsApp group, often on the
        traveller's own social media — so this endpoint **answers identically
        whether or not the number has a booking**, including when throttled. An
        endpoint that differs is a way to find out who booked what.


        Clients must not branch on the response: there is exactly one body.
      operationId: requestBookingRecovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, description: "E.164, e.g. +919000000000" }
      responses:
        "202":
          description: Always this, for every number.
          content:
            application/json:
              schema:
                type: object
                required: [sent, message]
                properties:
                  devCode:
                    type: string
                    description: >-
                      **Development only.** Present when the service runs
                      outside production so the flow can be exercised without an
                      SMS account. Never present in production; a client must
                      never depend on it. Documented rather than hidden — an
                      undocumented field that appears in some environments is
                      one a client accidentally comes to rely on.
                  sent: { type: boolean }
                  message:
                    type: string
                    description: >-
                      Hedged on purpose — the honest phrasing and the one that
                      reveals nothing.
        "400": { $ref: "#/components/responses/BadRequest" }

  /bookings/recovery/verify:
    post:
      tags: [bookings]
      summary: Exchange a recovery code for a new booking link
      description: >
        Returns a **new** status token and revokes the previous one. Token
        rotation is contractual, not incidental: recovery is most often used
        because a phone was lost or a message was seen by somebody else, so any
        link already in circulation must stop working.


        Wrong, expired, used and over-attempted codes all answer `401` with one
        message — telling a caller which it was tells somebody enumerating
        numbers whether the number exists.
      operationId: verifyBookingRecovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string }
      responses:
        "200":
          description: A fresh status token. The previous link no longer works.
          content:
            application/json:
              schema:
                type: object
                required: [statusToken]
                properties:
                  statusToken: { type: string }
                  note: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /bookings/cancellation:
    post:
      tags: [bookings]
      summary: Cancel a booking
      operationId: commitCancellation
      description: >-
        The other half of the quote, and deliberately narrower than it.


        `expectedRefundPaise` is required and must equal what the quote just
        showed. Not a confirmation checkbox — a checkbox records that somebody
        tapped, this records **what they were told**. Between reading a quote
        and pressing the button a traveller can cross a tier boundary; the
        24-hour line falls in the middle of the night and people do sit on this
        decision. If the figure has moved, this answers `409 refund_quote_moved`
        and the client re-quotes, rather than cancelling at a worse number than
        the traveller agreed to.


        **A partial refund of money paid online is not self-service.** It
        answers `409 refund_requires_finance` and nothing is destroyed, because
        cancelling is irreversible and the seat returns to sale immediately, so
        self-serving a partial refund would take the trip away now and leave the
        money in an approval queue for days. Routing the traveller to a person
        BEFORE anything is lost is the kinder order. A partial tier with nothing
        to refund, which is where a booking with nothing paid online lands,
        needs nobody and cancels here with `refundPaise` 0. `selfService` on the
        quote tells the client whether to show the button at all.


        **A departure that moved after this booking was made** cancels with
        everything paid online refunded, whatever the tier, recorded as
        `OPERATOR_MOVED_IT` (D-032.3). The quote says so first, in `note`.
      security: [{ statusToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRefundPaise]
              additionalProperties: false
              properties:
                expectedRefundPaise:
                  type: integer
                  description: Echo the quote's `refundPaise` back, unchanged.
      responses:
        "200":
          description: Cancelled. The seat is back on sale and the refund is raised.
          content:
            application/json:
              schema:
                type: object
                required: [bookingReference, state, refundPaise]
                properties:
                  bookingReference: { type: string }
                  state: { type: string, enum: [cancelled] }
                  refundPaise: { type: integer }
                  refundTier: { type: string }
                  seatsReleased: { type: integer }
                  refundNote:
                    type: string
                    description: >-
                      A phrase about the money. When nothing comes back it says
                      why: nothing was paid online for the booking, or no refund
                      is due under its cancellation policy.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: >-
            `refund_quote_moved` — re-quote and show the new figure.
            `refund_requires_finance`: a partial refund of money paid online; route them to support.
            `conflict` — not in a cancellable state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/bookings:
    get:
      tags: [me]
      summary: Every trip this phone number has booked
      operationId: listMyBookings
      description: >-
        **This is the whole of "traveller accounts".** There is no signup, no
        password and no new secret: signing in is the same OTP that already
        recovers a booking, and this is what it unlocks. An account here is a
        projection over a phone number somebody has proved they control.


        A traveller who never signs in loses nothing — none of this appears in
        the checkout path, and the founding claim is that a stranger pays in
        about a minute with no account.


        The phone comes from the verified token and is never a parameter. A
        `?phone=` here would let anyone read a stranger's itinerary by typing
        their number, which on a small island is a disclosure about where
        somebody will be and when.


        Since 2026-09-13 the credential is a `travellerSession` from
        `verifyTravellerSignIn`. A recovery token (`verifyBookingRecovery`) is
        still accepted. Requests still waiting on the operator are listed, with
        `state: pending_request` and no `reference` yet. Unpaid holds are not.


        **Tabs** (since 2026-09-13). `cancelled` is decided first and wins over
        the date: a trip whose `state` is `cancelled` (by the traveller, the
        operator or us, including a departure called off for weather) or
        `declined` (a booking or a request the operator refused). A `no_show`
        is **not** cancelled: the boat went, so it is a past trip. Of the rest,
        `upcoming` is a departure still ahead, including a request nobody has
        answered yet, and `past` is a departure that has left. The three tabs
        never overlap and together they are the whole list.


        **Paging.** A request with none of `tab`, `from`, `to`, `limit` or
        `cursor` returns every trip in one page with `nextCursor: null`, which
        is what apps deployed before paging existed rely on. Any one of them
        opts in to paging, and `limit` then defaults to 20. Pass `nextCursor`
        back as `cursor` with the same `tab`, `from` and `to`; a cursor from
        a different query is refused with `invalid_input`. A cursor also fixes
        the moment "upcoming" and "past" are split at, so a trip departing
        while somebody scrolls is never shown twice or skipped.


        Each returned row carries a freshly minted `statusToken`, so asking for
        a page rather than the whole history also mints fewer links.
      security: [{ travellerSession: [] }, { statusToken: [] }]
      parameters:
        - name: tab
          in: query
          required: false
          description: >-
            `upcoming`, `past` or `cancelled`, as defined above. Omitted means
            every trip.
          schema: { type: string, enum: [upcoming, past, cancelled] }
        - name: from
          in: query
          required: false
          description: >-
            The first trip date to include, `YYYY-MM-DD`, inclusive. Compared
            with the trip's own date in its market's timezone.
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: The last trip date to include, `YYYY-MM-DD`, inclusive. Not before `from`.
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: >-
            Trips still to come first, soonest first; then past ones, most
            recent first. Somebody opening this on the morning of a dive wants
            the dive, not the thing they did in March. The `upcoming` tab is
            soonest first, and the `past` and `cancelled` tabs are most recent
            trip date first. (Before 2026-09-13 past trips came back oldest
            first, contrary to this description.)
          content:
            application/json:
              schema:
                type: object
                required: [bookings, nextCursor]
                properties:
                  nextCursor:
                    type: [string, "null"]
                    description: >-
                      Pass back as `cursor` for the next page. `null` when there
                      is nothing more, and always `null` on an unpaged request.
                  bookings:
                    type: array
                    items:
                      type: object
                      required: [reference, reservationId, experience, operator, localDate, localTime, state, guests, statusToken, experienceSlug, operatorSlug, heroImageUrl, destination, startsAt, timezone, createdAt, price, reviewed, canReview]
                      properties:
                        reference:
                          type: string
                          description: Empty for a request the operator has not answered yet.
                        reservationId:
                          type: string
                          description: >-
                            Always present. What the app matches against the
                            trips saved on the phone when there is no reference
                            yet.
                        experience: { type: string }
                        operator: { type: string }
                        localDate: { type: string, format: date }
                        localTime: { type: string, example: "06:30" }
                        state:
                          type: string
                          description: >-
                            The booking's state, or for a request with no booking
                            yet `pending_request` (waiting on the operator) or
                            `declined` (the operator said no; see `reasonCode`).
                        guests: { type: integer }
                        meetingPoint: { type: string }
                        statusToken:
                          type: string
                          description: >-
                            A booking link for this trip, minted for this
                            response, so a trip booked on another phone opens
                            here. Opens this booking only; it can never list the
                            number's other trips. Issuing it revokes nothing.
                        cancelledAt: { type: [string, "null"], format: date-time }
                        reasonCode:
                          type: string
                          enum: [no_capacity, weather, not_operating, party_too_large, unsafe_for_party, other]
                          description: Why the operator declined. Present only when `state` is `declined`.
                        experienceSlug:
                          type: string
                          description: The listing this trip was booked from, for linking back to it.
                        operatorSlug:
                          type: string
                          description: The business, for linking to its page.
                        heroImageUrl:
                          type: [string, "null"]
                          format: uri
                          description: >-
                            The listing's headline picture, resolved exactly as
                            the catalog resolves `heroMedia`: a photograph from
                            the image host or a video's poster. `null` when the
                            listing has none; always sent.
                        destination:
                          type: string
                          description: The place's display name, for example `Havelock`.
                        startsAt:
                          type: string
                          format: date-time
                          description: >-
                            The departure as an instant, in UTC. `localDate` and
                            `localTime` are the same moment already rendered in
                            the market's zone.
                        timezone:
                          type: string
                          description: IANA zone of the market, for rendering local time.
                        createdAt:
                          type: string
                          format: date-time
                          description: >-
                            When the traveller asked for it: the reservation, so
                            a request and a paid booking both have one.
                        price:
                          type: object
                          required: [totalPaise, currency]
                          description: >-
                            The total agreed at checkout, from the frozen price
                            snapshot. The same number `getBookingStatus` reports.
                          properties:
                            totalPaise: { type: integer }
                            currency: { type: string }
                        payment:
                          type: object
                          required: [method, collected, amountPaise]
                          description: >-
                            How the booking is being paid. Present once a booking
                            exists; absent on a request nobody has answered.
                            `online` is paid and collected. `cash` is paid to the
                            operator on the day, and `collected` turns true when
                            they record taking it.
                          properties:
                            method: { type: string, enum: [online, cash] }
                            collected: { type: boolean }
                            amountPaise:
                              type: integer
                              description: The same number as `price.totalPaise`.
                        refund:
                          type: object
                          required: [amountPaise, state]
                          description: >-
                            Present only when a refund exists: the latest
                            refund's state and the sum on its way back, as
                            `getBookingStatus` reports it.
                          properties:
                            amountPaise: { type: integer }
                            state:
                              type: string
                              enum: [requested, pending, failed, processed, reversed, abandoned]
                        reviewed:
                          type: boolean
                          description: A review has been left for this trip.
                        canReview:
                          type: boolean
                          description: >-
                            Offer "leave a review": the trip is `completed`, has
                            no review yet, and ended no more than 30 days ago.
                            When true, `leaveReview` with this row's
                            `statusToken` will accept one.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/sign-in/request:
    post:
      tags: [me]
      summary: Send a sign-in code to any number
      operationId: requestTravellerSignIn
      description: >-
        Signing in, for any number, whether or not it has ever booked. Unlike
        `requestBookingRecovery` there is no booking for the answer to reveal,
        so it says plainly that a code was sent.


        There is no channel that delivers a traveller code yet (yuvoy-api#68);
        until there is, only the demo numbers receive one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, description: "E.164, e.g. +919000000000" }
      responses:
        "202":
          description: A code was recorded for the number.
          content:
            application/json:
              schema:
                type: object
                required: [sent, message]
                properties:
                  sent: { type: boolean }
                  message: { type: string }
                  devCode:
                    type: string
                    description: >-
                      **Development only**, as on `requestBookingRecovery`.
                      Never present in production.
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /me/sign-in/verify:
    post:
      tags: [me]
      summary: Exchange a sign-in code for a session
      operationId: verifyTravellerSignIn
      description: >-
        Returns a session that lasts 14 days since it was last used: every
        request it authenticates moves `expiresAt` to 14 days from then, so
        only a traveller away for 14 days is signed out. `expiresAt` here is
        the end as of signing in; `getMyAccount` answers the current one in
        `session.expiresAt`. **Revokes nothing**: every booking
        link saved on this phone, and any other phone this traveller is signed
        in on, keeps working. That is the difference from
        `verifyBookingRecovery`, which exists for a lost link and rotates it.


        Wrong, expired, used and over-attempted codes all answer `401` with one
        message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                required: [sessionToken, expiresAt]
                properties:
                  sessionToken:
                    type: string
                    description: "Send as an `Authorization: Bearer` header to `/me/bookings`."
                  expiresAt:
                    type: string
                    format: date-time
                    description: 14 days from now. Each use of the session moves it on.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /me/session:
    delete:
      tags: [me]
      summary: Sign out on this phone
      operationId: signOutTraveller
      description: >-
        Ends this session only. `204` whatever the token was, including one
        already ended.
      security: [{ travellerSession: [] }]
      responses:
        "204": { description: Signed out. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me:
    get:
      tags: [me]
      summary: The Account tab
      operationId: getMyAccount
      description: >-
        Who the signed-in traveller is, a summary of their trips, and how to
        reach a person. Reads only: a number with no profile answers
        `onboardingRequired: true` with `name`, `email` and `memberSince` null.


        `onboardingRequired` is true until the first-sign-in screen has been
        completed or skipped (`updateMyAccount`). **It is never a gate.** Show
        the screen, let it be dismissed, and never put it in front of a booking
        in progress.


        `trips` counts exactly the rows `listMyBookings` returns: `total` is
        its length, `upcoming` is trips still ahead that are confirmed or
        waiting on the operator (a declined or cancelled trip is not upcoming),
        and `completed` is trips that happened.


        `support.whatsappE164` is null until Yuvoy has a support number. Hide
        "Chat with us" while it is null. When present, open
        `https://wa.me/<number without +>?text=<message>` with the booking
        reference in the message; the traveller starts the chat, so nothing is
        sent on their behalf.


        `session` is present only when a traveller session signed the request
        in, and absent for a recovery token. `session.expiresAt` is when that
        session now ends, 14 days since this use. Keep a cookie or any stored
        expiry in step with it rather than with the value sign-in returned.
      security: [{ travellerSession: [] }, { statusToken: [] }]
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TravellerAccount" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      tags: [me]
      summary: Answer the first-sign-in screen, or edit the profile
      operationId: updateMyAccount
      description: >-
        Creates the profile on first save and updates it after. Send only the
        fields that change: an absent field is left alone, `email: null` or
        `email: ""` removes the email, and `interests: []` clears the
        interests.


        **The skip button is `{"onboarded": true}` on its own.** Any other
        first save needs a `name`. Saving a name also marks the screen
        answered, so the screen does not come back if `onboarded` is forgotten.


        `interests` are keys from `listInterestOptions`, or any category or
        activity-type key from `getPublicVocabulary`. At most 8 after
        duplicates are removed. Anything else is a `400`.


        Validation problems are a `400` with one plain sentence per field in
        `error.details`, keyed `name`, `email`, `interests` or `onboarded`.
      security: [{ travellerSession: [] }, { statusToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                  description: Trimmed before it is checked and stored.
                email:
                  type: [string, "null"]
                  maxLength: 254
                interests:
                  type: array
                  maxItems: 8
                  items: { type: string, pattern: "^[a-z][a-z0-9_]*$" }
                onboarded:
                  type: boolean
                  enum: [true]
                  description: The first-sign-in screen was completed or skipped.
      responses:
        "200":
          description: The account after the change, the same shape as `getMyAccount`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TravellerAccount" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/interest-options:
    get:
      tags: [me]
      summary: The tiles for the first-sign-in screen
      operationId: listInterestOptions
      description: >-
        Six to eight interests to offer, so the app does not invent its own
        list. Activity types with the most live listings come first; when too
        little is on sale to fill the screen, the busiest categories and then
        the leading categories top it up.


        **The populated vocabulary, not the active one**, which is why this is
        not a field on `getPublicVocabulary`. A filter chip must not vanish when
        its last listing pauses; a tile asking what somebody likes should only
        offer what is actually sold.


        No session. `marketKey` narrows to one market; without it, every market.
        Edge-cacheable for a few minutes.
      parameters:
        - name: marketKey
          in: query
          schema: { $ref: "#/components/schemas/MarketKey" }
      responses:
        "200":
          description: The tiles, in the order to show them.
          content:
            application/json:
              schema:
                type: object
                required: [options]
                properties:
                  options:
                    type: array
                    minItems: 6
                    maxItems: 8
                    items:
                      type: object
                      required: [key, label, kind]
                      properties:
                        key: { type: string, description: "What to send in `interests`." }
                        label: { type: string }
                        kind: { type: string, enum: [activityType, category] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /support/requests:
    post:
      tags: [me]
      summary: Send Yuvoy a message from the app
      operationId: createSupportRequest
      description: >-
        The in-app help form. The message reaches the admin customer support
        queue (`adminCustomerSupport`, kind `TRAVELLER_HELP_REQUEST`, source
        `traveller`), and a person replies on WhatsApp.


        Accepts a signed-in session **or** a booking link's status token, so a
        traveller who booked without signing in can still ask for help.


        `bookingReference` is optional. With a session it must be a booking on
        the signed-in number; with a booking link it must be that link's own
        booking, and when omitted the link's booking is attached anyway.
        Somebody else's reference, or one that does not exist, is a `404`.


        Sending the same message about the same booking again returns the same
        `reference` rather than opening a second case. Five requests an hour per
        number, then `429`.
      security: [{ travellerSession: [] }, { statusToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 10, maxLength: 2000 }
                bookingReference: { type: string, example: YV-8K2M4PQR }
                topic:
                  type: string
                  enum: [booking, payment, cancellation, other]
                  default: other
      responses:
        "201":
          description: The message is in the support queue.
          content:
            application/json:
              schema:
                type: object
                required: [reference, message]
                properties:
                  reference:
                    type: string
                    example: SR-3F9A12C0
                    description: Short enough to quote on a call.
                  message:
                    type: string
                    description: Plain words to show the traveller.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /bookings/share:
    post:
      tags: [bookings]
      summary: Make a link for the people coming
      operationId: shareBooking
      description: >-
        A link for a different audience from the person who paid, and therefore
        a different token.


        The status token opens the booking — the payer's name, their number, the
        amount, the refund position, the cancel button. A trip pasted into a
        hostel WhatsApp group of six strangers must reveal none of that. This
        token opens what somebody needs in order to turn up and nothing else,
        and the response says so in words, because the person about to paste it
        is the one who needs to know what it reveals.


        Only the holder of the status token can mint one: you may share your own
        trip, not somebody else's.
      security: [{ statusToken: [] }]
      responses:
        "201":
          description: A shareable link.
          content:
            application/json:
              schema:
                type: object
                required: [shareUrl, expiresIn]
                properties:
                  shareUrl:
                    type: string
                    description: >-
                      Opens `/trip/{token}` on the traveller app, the shared-trip
                      page that reads `GET /v1/trips/{token}`.
                    example: https://app.yuvoy.in/trip/3q2-Xw9vLk
                  expiresIn: { type: integer, description: Seconds. }
                  reveals:
                    type: string
                    description: Plain words for what the link exposes.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /trips/{token}:
    get:
      tags: [bookings]
      summary: Open a shared trip
      operationId: getSharedTrip
      description: >-
        Unauthenticated by design — the token IS the authorisation, and
        everybody in the group has it. What it buys is deliberately small.


        Note what is absent, and that the absence is the design: no phone
        number, no email, no name, no amount paid, no refund position and no
        cancel action. `partySize` is a count, never a guest list — who is
        coming is theirs to say in the group chat, not ours.


        A cancelled trip still resolves. Somebody opening a link for a departure
        that was called off must be told, not shown a dead page.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: What somebody needs in order to turn up.
          content:
            application/json:
              schema:
                type: object
                required: [experience, operator, localDate, localTime, meetingPoint, partySize, cancelled]
                properties:
                  experience: { type: string }
                  operator: { type: string }
                  localDate: { type: string, format: date }
                  localTime: { type: string }
                  meetingPoint: { type: string }
                  landmark: { type: string }
                  durationMinutes: { type: integer }
                  bring: { type: array, items: { type: string } }
                  partySize: { type: integer }
                  cancelled: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /bookings/invites:
    post:
      tags: [bookings]
      summary: Invite somebody onto this trip
      operationId: createTripInvite
      description: >-
        Offers one place in the party, to a phone number or as a link. Both
        answer with `inviteUrl`, so the booker can copy an invitation to a
        number into a chat of their own. The link is returned once and never
        again; offer Copy and Share rather than printing it.


        With `phone`, the invitation also waits in that number's own account
        (`listInvitedTrips`) with no link at all. Numbers are normalised as at
        checkout, so a bare ten-digit number is taken as +91.


        Without `phone`, the link is single-use: the first verified number to
        accept it has the place.


        **The guest-count rule.** Live invitations (invited or joined) may not
        exceed the party size less the booker, so a party of four can invite
        three people and a party of one nobody. Declined and removed
        invitations do not use a place. Beyond that, `409`.


        **Delivery.** There is no WhatsApp sender yet, so an invitation to a
        number reads `delivery: not_sent_no_channel` and nothing is queued. When
        a sender is configured the same request reads `queued`. A link is never
        sent by us and reads `not_applicable`.


        Authorised by the booking's status token (any issuer, including the
        `statusToken` rows of `listMyBookings`), or by a traveller session for
        the number the booking was made with, in which case `reservationId` is
        required. A share token is refused. Invitations are taken for a trip
        that is confirmed, or a request still waiting on the operator, and that
        has not ended.
      security: [{ statusToken: [] }, { travellerSession: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: The number to invite. Omit for a link anybody may accept once.
                reservationId:
                  type: string
                  description: >-
                    Which booking, when signed in with a session. Optional with a
                    status token, where it must be that token's own booking.
      responses:
        "201":
          description: The invitation, with its link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedTripInvite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            `conflict`. The trip is not taking invitations (cancelled, called
            off, over, or an unpaid hold), every place is already offered, that
            number already has an invitation, or it is the booker's own number.
            `message` says which.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    get:
      tags: [bookings]
      summary: Who the booker invited
      operationId: listTripInvites
      description: >-
        Every invitation on this booking except removed ones, oldest first. A
        number is shown masked to its last four digits, unless the guest joined
        with a profile name, in which case the name is shown instead. Declined
        invitations stay, so the booker knows.
      security: [{ statusToken: [] }, { travellerSession: [] }]
      parameters:
        - name: reservationId
          in: query
          required: false
          description: Required with a travellerSession.
          schema: { type: string }
      responses:
        "200":
          description: The guests, and how many places there are to offer.
          content:
            application/json:
              schema:
                type: object
                required: [guests, maxGuests]
                properties:
                  guests:
                    type: array
                    items: { $ref: "#/components/schemas/TripGuest" }
                  maxGuests:
                    type: integer
                    description: The party size less the booker.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /bookings/invites/{id}:
    delete:
      tags: [bookings]
      summary: Remove a guest or revoke an invitation
      operationId: removeTripGuest
      description: >-
        Withdraws an invitation, revokes its link, or takes somebody who joined
        off the trip. Their access ends on the next request. `204` also when
        they were already removed. With a session, `reservationId` may be
        omitted: the invitation names its booking, and the session must be the
        number that booking was made with.
      security: [{ statusToken: [] }, { travellerSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: reservationId
          in: query
          required: false
          schema: { type: string }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /invites/{token}:
    get:
      tags: [bookings]
      summary: Which trip an invitation link is for
      operationId: previewTripInvite
      description: >-
        Unauthenticated. Names the trip so somebody knows what they are signing
        in for: the experience, the day, the operator and where it stands.
        Nothing personal and nothing about money. `404` for a link that is
        unknown, revoked, declined, or past the end of its trip.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The trip behind the link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripInvitePreview" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /invites/{token}/accept:
    post:
      tags: [me]
      summary: Accept an invitation link
      operationId: acceptTripInvite
      description: >-
        Joins the trip as the number the session proved (`verifyTravellerSignIn`).
        An invitation addressed to a number can be accepted by that number only;
        any other number gets `404`, not `403`. A link addressed to nobody is
        single-use. Accepting again is not an error. The trip then appears in
        `listInvitedTrips`.
      security: [{ travellerSession: [] }]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The trip, as a guest sees it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitedTrip" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            `conflict`. The trip was cancelled or called off before it was
            accepted, or this is the number the trip was booked with.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/invited-trips:
    get:
      tags: [me]
      summary: Trips this number was invited to
      operationId: listInvitedTrips
      description: >-
        Trips the signed-in number joined as a guest, and invitations addressed
        to it that can still be accepted, each with `role: guest`. Ordered as
        trips are: upcoming soonest first, then past ones most recent first.


        **Separate from `listMyBookings` on purpose.** Those rows carry a booking
        link and belong to the person who booked; these carry no money, no
        reference and no link, and an invitee cannot cancel or change anything.
        The app merges the two lists, telling them apart by `role`.
      security: [{ travellerSession: [] }]
      responses:
        "200":
          description: The trips.
          content:
            application/json:
              schema:
                type: object
                required: [trips]
                properties:
                  trips:
                    type: array
                    items: { $ref: "#/components/schemas/InvitedTrip" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/invited-trips/{id}:
    get:
      tags: [me]
      summary: One trip this number was invited to
      operationId: getInvitedTrip
      security: [{ travellerSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The trip, as a guest sees it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitedTrip" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/invited-trips/{id}/accept:
    post:
      tags: [me]
      summary: Accept an invitation from the list
      operationId: acceptInvitedTrip
      description: >-
        For an invitation addressed to this number, with no link needed.
        Accepting again is not an error.
      security: [{ travellerSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The trip, as a guest sees it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitedTrip" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`conflict`. The trip was cancelled or called off before it was accepted."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /me/invited-trips/{id}/decline:
    post:
      tags: [me]
      summary: Decline an invitation
      operationId: declineInvitedTrip
      description: >-
        Frees the place for somebody else and takes the trip out of this list.
        Declining again is not an error; declining a trip already joined is
        `409`.
      security: [{ travellerSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Declined. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`conflict`. This number already joined the trip."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /bookings/review:
    post:
      tags: [bookings]
      summary: Say how the trip went
      operationId: leaveReview
      description: >-
        Only from a booking whose trip has actually happened — `completed`, not
        `confirmed`. A confirmed booking is one that is going to happen, and a
        review of a trip nobody has taken is exactly the fabricated claim this
        API is built not to make.


        One per booking, enforced by a unique constraint rather than a check: a
        booking is a trip somebody took, and a second review of it is an edit.


        **Nothing written here is published to anybody yet.** The catalog
        carries no rating and no review count, and that ABSENCE is what enforces
        the no-fabricated-claims rule — not a promise to be careful. Collecting
        from day one is what makes the numbers real on the day there is
        something worth showing.


        A review is taken for 30 days after the departure's scheduled end.
        Each refusal has its own code, all `409`: `not_reviewable_yet` (the
        trip has not been marked completed), `already_reviewed` (one per trip),
        and `review_window_closed` (more than 30 days after the trip).
        `canReview` on `listMyBookings` and `review.canReview` on
        `getBookingStatus` say in advance whether this will be accepted.
      security: [{ statusToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment:
                  type: string
                  maxLength: 2000
                  description: >-
                    Optional. Plenty of people tap five stars and nothing else,
                    and a required comment box turns a two-second act into an
                    abandoned one.
                tags:
                  type: array
                  maxItems: 6
                  description: >-
                    Optional. What was good, from a closed list. Repeats are
                    dropped and the order is kept. A value outside the list, or
                    more than six entries, is refused with `invalid_input`.
                    Stored with the review and never editable afterwards.
                  items:
                    type: string
                    enum: [guide, safety, value, organisation, punctuality, equipment]
      responses:
        "204": { description: Recorded. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: >-
            Refused, and `error.code` says why: `not_reviewable_yet`,
            `already_reviewed` or `review_window_closed`. Before 2026-09-13
            all three were `conflict`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /bookings/answers:
    post:
      tags: [bookings]
      summary: Answer the questions the listing asks
      description: >
        The traveller answering the operator's questions on this listing, after
        checkout, from the booking link. `GET /bookings/status` carries the
        questions, what this party has answered, and `answersOpen`.


        Each answer replaces this party's earlier answer to the same question,
        whether that was given at checkout or here. Questions left out keep what
        they had. All or nothing: if one answer does not fit its question,
        nothing is saved, and `details` names each problem, keyed like
        `answers[0].answer`.


        `yes_no` takes `yes` or `no`, and `choice` takes one of the question's
        `options`, both ignoring case. `short_text` takes up to 300 characters.
        Unknown fields are refused.


        Answers are taken while the booking is going ahead and until its
        departure leaves; after that this answers `409 answers_closed`. These
        questions never ask about health, which is the screener at checkout.


        Answers are kept for 90 days after the departure ends, and then deleted,
        unless a legal hold names this booking (D46). `PartyQuestion` says how
        the booking reads afterwards.
      operationId: answerBookingQuestions
      security: [{ statusToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingAnswersInput" }
      responses:
        "200":
          description: Saved. Every question and answer for this party, as the status page shows them.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [questions]
                properties:
                  questions:
                    type: array
                    items: { $ref: "#/components/schemas/PartyQuestion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: >-
            `answers_closed`: the departure has left, or the booking is no longer
            going ahead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /bookings/cancellation-quote:
    get:
      tags: [bookings]
      summary: What cancelling would refund
      description: >
        A read that changes nothing. A traveller deciding whether to cancel
        should see the number **first** — showing it only afterwards is how
        people end up feeling tricked by a policy they did agree to.


        Priced from the policy snapshot frozen at checkout, never from the live
        listing. `selfService` tells the client whether to render a cancel
        button at all: a partial refund is an amount somebody has to stand
        behind, and offering a button that then fails is worse than not offering
        one.


        **A departure that moved after this booking was made refunds in full**
        (D-032.3). If the operator moved the departure while this booking, or
        the hold it was made from, was on it, the quote is everything paid
        online whatever tier the snapshot holds, until the departure leaves, and
        `note` says why. A booking made after the move chose the new time and
        gets the usual tiers.


        A valid token whose booking does not exist yet answers `200` with
        `cancellable: false` and a reason — the token's validity and the
        booking's existence are different questions.
      operationId: quoteCancellation
      security:
        - statusToken: []
      responses:
        "200":
          description: The quote.
          content:
            application/json:
              schema:
                type: object
                required: [cancellable, selfService]
                properties:
                  bookingReference: { type: string }
                  cancellable: { type: boolean }
                  selfService:
                    type: boolean
                    description: >-
                      False when the refund is part of what was paid online:
                      that needs a person. A partial tier with nothing to
                      refund is self-service.
                  capturedPaise: { type: integer }
                  refundPaise: { type: integer }
                  refundTier: { type: string }
                  hoursBeforeStart: { type: integer }
                  reason: { type: string, description: Present when not cancellable. }
                  note:
                    type: string
                    description: >-
                      A sentence to show beside the figure, when there is one: a
                      partial refund of money paid online, which needs a person,
                      or a departure the operator moved after this booking was
                      made, which refunds everything paid online.
        "401": { $ref: "#/components/responses/Unauthorized" }

  /bookings/status:
    get:
      tags: [bookings]
      summary: What happened to my booking
      description: >
        The page a traveller lands on after checkout, and the only way back to a
        booking made without an account.


        The status token from `createReservation` is presented as
        `Authorization: Bearer <token>` and **never as a query parameter** — this
        service logs the request URI on every request, and a URL additionally
        reaches browser history, proxies, referrer headers and page analytics.
        The web route fronting this sets `Referrer-Policy: no-referrer`.


        `state` is computed server-side from the underlying state machines and is
        never stored as a column. Clients must not derive it: a hold whose
        deadline has passed reads `expired` here even though the stored row still
        says `active`, because the seat is genuinely gone the instant the hold
        lapses — the sweep that rewrites the row is tidiness, not truth.


        Poll every 3s with backoff while `final` is `false`. Stop when it is
        `true`; do not hardcode which states are terminal, or the list goes stale
        the first time one is added.


        An expired token is answered `token_expired` rather than the generic
        unauthorized code, so the page can offer to send a new link. An unknown
        token and a revoked one are deliberately indistinguishable.
      operationId: getBookingStatus
      security:
        - statusToken: []
      responses:
        "200":
          description: The booking as the traveller may see it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /bookings/messages:
    get:
      tags: [bookings]
      summary: The conversation with the business
      description: >
        The conversation on this booking between the traveller and the business
        running the trip (D6). The booking link's token opens it, exactly as it
        opens `getBookingStatus`, and no booking id is taken: the token is the
        booking, so a link opens its own conversation and no other.


        **The most recent messages first, a page at a time, oldest first within
        a page.** Draw a page top to bottom. To load what came before it, pass
        `nextCursor` back as `cursor`; it is absent when the conversation begins
        on this page. A message that arrives while somebody scrolls is after the
        first page and never inside a later one, so fetch the first page again
        to see new messages.


        Fetching marks nothing read. Mark what was shown with
        `markBookingMessagesRead`, so a page left polling in a pocket does not
        clear `unreadCount`.


        A link whose hold or request never became a booking answers an empty,
        complete conversation with `canWrite` false and `closedReason`
        `not_booked`, not an error.


        A message's text is removed a set time after the trip ends (90 days
        unless the service is configured otherwise). The message stays, with who
        wrote it and when, and carries `textRemovedAt` in place of `text`. Show
        it as a message whose text was removed, never as an empty one.
      operationId: getBookingMessages
      security:
        - statusToken: []
      parameters:
        - name: limit
          in: query
          description: >-
            Messages per page. None, or a value that is not a whole number above
            zero, gets 50. More than 200 gets 200.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: >-
            A previous page's `nextCursor`, for the messages before that page.
            Opaque, so do not construct one. A cursor this conversation did not
            issue is a `400`.
          schema: { type: string }
      responses:
        "200":
          description: One page of the conversation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingMessageThread" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [bookings]
      summary: Write to the business
      description: >
        Adds a message to this booking's conversation and queues a notice for
        the business: every active person there, once for this message, on
        WhatsApp or email as this service can send. The notice names the trip
        and the booking reference and never carries the text, which is read in
        the conversation.


        The text is trimmed, keeps its line breaks, and is at most 1000
        characters, counted as characters rather than bytes.


        **A message with a phone number, an email address or a link in it is
        refused** `400 invalid_input`, with `details.text` `contact details` and
        `details.contactDetail` saying which: `phone`, `email` or `link`.
        Nothing is stored, and the refusal names the kind without repeating any
        of the text. A phone number is seven or more digits written close
        together, counted through the spaces, dashes, brackets and dots between
        them, except the digits of a date written like 14.09.2026 or 2026-09-14.
        A link starts `http://`, `https://` or `www.`, or is a word ending
        `.com`, `.in`, `.net`, `.org`, `.io`, `.co` or `.me`, so a full stop
        typed with no space before one of those words reads as a link too. An
        email address is a name, an `@` and a domain with a dot in it.


        Writing stops when the booking is cancelled or declined, and a set time
        after the trip ends (seven days unless the service is configured
        otherwise). After that the conversation can still be read, and a message
        is refused `409 messages_closed` with `details.reason` saying which.
      operationId: sendBookingMessage
      security:
        - statusToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingMessageInput" }
      responses:
        "201":
          description: Written, and the business's notice is queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingMessage" }
        "400":
          description: >-
            `invalid_input`, with `details.text` saying why: `required` (nothing
            written, or a body that is not JSON), `too long` (over 1000
            characters), `unprintable` (characters no screen can show), or
            `contact details`, with `details.contactDetail` `phone`, `email` or
            `link`. Nothing was stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: >-
            `messages_closed`: the conversation can be read and not written in.
            `details.reason` is `not_booked`, `cancelled`, `declined` or
            `window_closed`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /bookings/messages/read:
    post:
      tags: [bookings]
      summary: Mark the conversation read up to a message
      description: >
        Moves the traveller's read marker to a message they were shown, and so to
        everything before it, and answers what is still unread. Named by the
        message rather than "all of it, now", so a message that arrived after
        the page was drawn stays unread. A marker never moves back: naming an
        older message changes nothing.
      operationId: markBookingMessagesRead
      security:
        - statusToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingMessageReadInput" }
      responses:
        "200":
          description: What is still unread.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingMessageReadReceipt" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: That message is not in this booking's conversation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    travellerSession:
      type: http
      scheme: bearer
      description: >-
        The opaque token `verifyTravellerSignIn` returns. Proves a code reached
        a phone number; not tied to any booking. Lasts 14 days since it was
        last used: each request it authenticates extends it.
    statusToken:
      type: http
      scheme: bearer
      description: >-
        The opaque token minted by `createReservation`. Not a JWT and carries no
        claims — it is 256 bits of random with no meaning outside our database,
        which is what lets it be revoked and lets a stolen one be worthless once
        it is.

  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: A dependency is unavailable; the request was not recorded
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    CatalogUnavailable:
      description: >
        The catalog cannot be read. Deliberately NOT an empty `200`: an empty
        list reads to a traveller as "nothing is on", which is a different and
        untrue statement about the world.


        Referenced from the experience routes since the contract was written and
        never defined until now — so the document did not resolve, and anything
        generating a client from it would have failed on this ref.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    TripInviteDelivery:
      type: string
      enum: [not_sent_no_channel, queued, not_applicable]
      description: >-
        Whether we told anybody. `not_sent_no_channel`: an invitation to a
        number while there is no WhatsApp sender; it still waits in that
        number's account. `queued`: a WhatsApp message is on its way.
        `not_applicable`: a link, which we never send.

    GuestTripStatus:
      type: string
      enum: [pending, confirmed, completed, cancelled, called_off]
      description: >-
        Where the trip stands, for a guest. `pending` is a request still waiting
        on the operator. `called_off` is the operator standing the departure
        down; `cancelled` is the booking withdrawn, declined or lapsed.

    CreatedTripInvite:
      type: object
      required: [id, state, delivery, inviteUrl]
      properties:
        id: { type: string }
        state: { type: string, enum: [invited] }
        delivery: { $ref: "#/components/schemas/TripInviteDelivery" }
        inviteUrl:
          type: string
          description: >-
            Returned once. Offer Copy and Share; do not print it. Opens
            `/i/{token}` on the traveller app, where the invited person signs in
            with their own number and accepts.
          example: https://app.yuvoy.in/i/8Hk2-pQv7Zr

    TripGuest:
      type: object
      required: [id, state, delivery, createdAt]
      description: One invitation as the booker sees it. At most one of `name` and `phoneMasked`; a link nobody accepted has neither.
      properties:
        id: { type: string }
        phoneMasked:
          type: string
          description: The number's last four digits, the rest replaced.
        name:
          type: string
          description: The name a guest's profile had when they joined.
        state: { type: string, enum: [invited, joined, declined] }
        delivery: { $ref: "#/components/schemas/TripInviteDelivery" }
        createdAt: { type: string, format: date-time }

    TripInvitePreview:
      type: object
      required: [experience, experienceSlug, operator, localDate, localTime, status]
      properties:
        experience: { type: string }
        experienceSlug: { type: string }
        operator: { type: string }
        localDate: { type: string, format: date }
        localTime: { type: string, example: "06:30" }
        status: { $ref: "#/components/schemas/GuestTripStatus" }

    InvitedTrip:
      type: object
      description: >-
        A trip as a guest sees it. Deliberately absent: the booking reference,
        any booking link, the price, the payment, the refund position, and
        anything about the person who paid. A guest cannot cancel or change the
        booking.
      required: [id, role, guestState, experience, experienceSlug, operator, localDate, localTime,
                 meetingPoint, durationMinutes, partySize, status, going]
      properties:
        id:
          type: string
          description: The invitation's id, for getInvitedTrip, acceptInvitedTrip and declineInvitedTrip.
        role: { type: string, enum: [guest] }
        guestState: { type: string, enum: [invited, joined] }
        experience: { type: string }
        experienceSlug:
          type: string
          description: Links to the listing, `getExperience`.
        operator: { type: string }
        localDate: { type: string, format: date }
        localTime: { type: string, example: "06:30" }
        meetingPoint: { type: string }
        landmark: { type: string }
        durationMinutes: { type: integer }
        bring:
          type: array
          items: { type: string }
          description: What to bring. No listing field carries this yet, so it is absent for now.
        partySize: { type: integer }
        status: { $ref: "#/components/schemas/GuestTripStatus" }
        going:
          type: array
          description: >-
            Guests who accepted, in the order they did. A name only when they
            joined with a profile name, otherwise "Guest"; never a number. The
            booker is not listed; `partySize` counts them.
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              you: { type: boolean, description: Present and true on the caller's own place. }

    TravellerAccount:
      type: object
      required: [phone, name, email, interests, onboardingRequired, memberSince, trips, reviews, support]
      properties:
        phone: { type: string, description: "The proven number, in E.164." }
        name:
          type: [string, "null"]
          description: Null until given; also null for somebody who skipped the first screen.
        email: { type: [string, "null"] }
        interests:
          type: array
          items: { type: string }
          description: Category and activity-type keys, in the order chosen.
        onboardingRequired:
          type: boolean
          description: Show the first-sign-in screen, skippable. Never a gate on booking.
        memberSince:
          type: [string, "null"]
          format: date-time
          description: The earlier of the profile's creation and the first booking on the number.
        trips:
          type: object
          required: [total, upcoming, completed]
          properties:
            total: { type: integer }
            upcoming: { type: integer }
            completed: { type: integer }
        reviews:
          type: object
          required: [count]
          properties:
            count: { type: integer, description: "Reviews this number wrote, published or not." }
        support: { $ref: "#/components/schemas/SupportContact" }
        session:
          type: object
          description: >-
            Present only when a traveller session signed the request in; absent
            for a recovery token. Additive: a client that ignores it loses
            nothing.
          required: [expiresAt]
          properties:
            expiresAt:
              type: string
              format: date-time
              description: >-
                When this session now ends: 14 days since it was last used,
                including this request.

    SupportContact:
      type: object
      description: >-
        How a traveller reaches a person. The same configuration everywhere it
        appears (`getMyAccount`, `getBookingStatus`).
      required: [whatsappE164, hours]
      properties:
        whatsappE164:
          type: [string, "null"]
          description: Null while Yuvoy has no support number. Hide "Chat with us" then.
        hours: { type: string, description: "When somebody is there to reply, in words." }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            details: { type: object, additionalProperties: true }
            requestId: { type: string }

    ErrorCode:
      type: string
      description: >-
        A closed set, so a client can branch on the machine-readable code and
        never on the message. Codes are added by contract change, never invented
        at the call site.
      enum:
        # Transport and shape
        - invalid_input
        - unauthorized
        - not_found
        - conflict
        - rate_limited
        - method_not_allowed
        - not_implemented
        - internal_error
        # The global 64 KB body limit refused the request before any handler
        # saw it. Retrying the same body fails identically — send less, or
        # send it in pieces.
        - payload_too_large
        # The unclassified case, and deliberately named as one: an HTTP-level
        # 4xx at a status this API does not anticipate, produced by the
        # framework rather than by a handler. There is nothing to branch on
        # beyond the status. It replaced an undeclared literal `error` on
        # 2026-09-07; anything seen arriving with it is a status that has
        # earned a code of its own.
        - unclassified_error
        # Availability and capacity. Each names a different reason a traveller
        # cannot proceed, because "unavailable" alone leaves them with no next
        # step — and one of these is not the traveller's fault at all.
        - capacity_unavailable
        # Retired 2026-09-13 and no longer returned: every request is taken, at
        # any hour. Kept in the enum so a deployed client's exhaustive handling
        # still type-checks.
        - request_quota_exhausted
        - request_window_closed
        - grant_ceiling_exceeded
        - cutoff_passed
        - stale_availability
        # Deliberately stopped, rather than broken. Truthful copy depends on the
        # client being able to tell these from an outage.
        - booking_disabled
        # Since 0053 this is returned by POST /v1/reservations/{id}/payment-order
        # as well as by reservation create: the operator's standing is re-checked
        # when a traveller re-enters checkout, not only when they first hold a
        # seat. It never carries a reason — why a business stopped selling is a
        # supply judgment about them, and this is a traveller endpoint.
        - operator_not_bookable
        # Idempotency and checkout, emitted today but previously undeclared —
        # a client cannot branch on a code the contract does not name.
        - idempotency_key_malformed
        - idempotency_key_reuse
        - idempotency_in_progress
        # Access to a booking without an account.
        - token_expired
        - reservation_not_payable
        # The booking takes no more answers to its listing's questions: the
        # departure has left, or the booking is no longer going ahead.
        - answers_closed
        # A checkout that sent answers left a question the listing requires
        # without one. `details.questions` names each (D45).
        - answers_required
        # Why a review was refused, all 409. Each is a different screen: come
        # back after the trip, thank you, or this has closed.
        - not_reviewable_yet
        - already_reviewed
        - review_window_closed
        # Refused for saying it wrong rather than for lacking permission. Each
        # is a different next step for the caller: fix the code, echo the
        # confirmation back, pick a role that exists.
        - invalid_reason_code
        - refund_quote_moved
        # Safety refusals. Distinct codes because each leaves the traveller with
        # a different next step, and "talk to us first" is not the same message
        # as "this trip has a minimum age".
        - screening_required
        - screening_needs_a_doctor
        - under_minimum_age
        - refund_requires_finance
        - confirmation_required
        - invalid_role
        # Configured-off surfaces. Distinguishable from an outage on purpose.
        - payments_unavailable
        - media_unavailable
        # The booking store this endpoint needs is not wired, so recovery,
        # cancellation quotes and "my trips" cannot answer. A 503: the request
        # was not recorded and retrying later is the right move, which is why
        # it is not `internal_error`. The three sibling surfaces each name
        # themselves (`admin_unavailable`, `operator_unavailable`,
        # `media_unavailable`); this one predates that convention and is left
        # under the bare spelling the handlers actually write rather than
        # renamed underneath a client.
        - unavailable
        # A booking's conversation that can be read and not written in: no
        # booking behind the link yet, a cancelled or declined booking, or a
        # trip that ended longer ago than messages stay open. `details.reason`
        # says which.
        - messages_closed

    Money:
      type: object
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
          description: Amount in the currency's minor unit (paise for INR)
          example: 450000
        currency: { type: string, example: INR }

    Category:
      type: string
      enum:
        - adventure
        - nature_wildlife
        - food_drink
        - arts_creativity
        - learning
        - culture_heritage
        - wellness
        - entertainment
        - community
        - sports
        - local_life
        - events

    ExperienceMode:
      type: string
      enum: [local, travel]

    PolicyTier:
      type: string
      enum: [flexible, firm, weather]

    ProviderTier:
      type: string
      enum: [professional, creator, community]

    Provider:
      type: object
      required: [id, name, tier]
      properties:
        id: { type: string }
        name: { type: string }
        tier: { $ref: "#/components/schemas/ProviderTier" }
        verified: { type: boolean }

    Media:
      type: object
      # A playback object, not a URL. Video is delivered as adaptive-bitrate
      # HLS/DASH from the media provider's edge, so there is no single "the
      # url" — the client picks a rendition. posterUrl always resolves and
      # renders first; a client on a slow connection may show only that.
      required: [id, kind, posterUrl]
      properties:
        id: { type: string }
        kind: { type: string, enum: [image, video] }
        playbackId: { type: string }
        hlsUrl:
          type: string
          format: uri
          description: >-
            **Not populated before M15.** Render poster-first and treat playback
            as progressive enhancement: `posterUrl` always resolves, and on a
            0.5-3 Mbps island connection the poster is what most travellers see
            first anyway.
        dashUrl:
          type: string
          format: uri
          description: Not populated before M15. See `hlsUrl`.
        posterUrl: { type: string, format: uri }
        durationSeconds: { type: number, format: float }
        aspectRatio:
          type: string
          description: "e.g. '9:16'. The feed is vertical; a non-9:16 clip is flagged in review."
          examples: ["9:16"]
        alt: { type: string }

    OperatorSummary:
      type: object
      # What a traveller may know about who is running the experience. There is
      # no rating: reviews do not exist until real completed bookings produce
      # them, and a number nobody earned is a fabricated claim.
      required: [id, slug, name, verified]
      properties:
        id: { type: string }
        slug:
          type: string
          description: >-
            How a card links to the business's own page, `/v1/operators/{slug}`.


            Added when that page shipped and was reachable from nothing: every
            card carried the operator's name and id, the page is addressed by
            slug, and so the one journey it exists for — reel, listing, operator
            — could not be built. Use this rather than `id` in a URL: the id is
            ours, and the slug is what a traveller can read and yuvoy-web can
            index.
        name: { type: string }
        verified:
          type: boolean
          description: >-
            True only when every mandatory credential is on file, verified and
            unexpired. It is a statement about evidence we hold, not a badge.
        logoUrl:
          type: string
          description: >-
            The operator's own mark. **Absent when they have not set one**, so
            fall back to your own placeholder rather than rendering a broken
            image.


            Show it on a card whose `heroMedia` is absent. A logo is not a
            substitute for footage — the feed is video — but a card carrying the
            operator's mark is something a person can recognise and tap, and an
            empty rectangle is neither.
        credentialsSummary:
          type: array
          description: Human-readable statements of what was checked, each backed by a record.
          items: { type: string }

    ExperienceSummary:
      type: object
      required:
        [
          id,
          slug,
          title,
          marketKey,
          destinationKey,
          category,
          bookingMode,
          durationMinutes,
          operator,
        ]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        marketKey: { $ref: "#/components/schemas/MarketKey" }
        destinationKey: { $ref: "#/components/schemas/DestinationKey" }
        location: { type: string, description: Display name of the destination. }
        category: { $ref: "#/components/schemas/Category" }
        activityType:
          type: string
          description: >-
            What this experience actually is — `scuba`, not `adventure`.


            `category` is market-agnostic and is what a traveller browses by; it
            cannot describe the thing, because in the launch market every water
            sport is `adventure`. **Absent** on listings that predate the
            vocabulary, so render nothing rather than a placeholder noun.


            Deliberately **not an enum**, unlike `category`: the set grows by
            INSERT and an enum would go stale — the same reasoning the operator
            contract already gives for `destination`. `category` stays a closed
            enum because it is what a traveller browses by and it is not growing.
          examples: ["scuba"]
        activityTypeLabel:
          type: string
          description: >-
            `activityType` as the word to print. From the same table the operator
            picker reads, so the two cannot word the same noun differently.
            Present exactly when `activityType` is.
          examples: ["Scuba diving"]
        bookingMode:
          $ref: "#/components/schemas/BookingMode"
        durationMinutes: { type: integer }
        maxPartySize: { type: integer }
        fromPrice:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: >-
            **The listing's unit price, in the unit `pricingUnit` names.** Absent
            until a real contracted price exists; there is no placeholder price
            anywhere in this API.


            The name implies a floor across variants and that is not what it is:
            it is a single number, and for a `per_group` charter "from ₹4,000"
            is wrong twice — it is not a minimum, and it is not per person. The
            field is not renamed because generated clients carry the name.
            If it is ever renamed, the right name is `price`.
        pricingUnit:
          type: string
          enum: [per_person, per_group]
          description: >-
            How `fromPrice` is charged. `per_person` multiplies by the party;
            `per_group` is the price of the whole departure whatever the party
            size. **Present exactly when `fromPrice` is present.**


            This existed in the schema and at checkout from the beginning and was
            never selected by any public read path, so both traveller surfaces
            hard-coded "per person" and a ₹4,000 per-GROUP listing read as
            ₹4,000 per person until the last screen.
        pricingUnitLabel:
          type: string
          description: >-
            `pricingUnit` as the phrase to print beside the price. **Render it
            verbatim; do not build one from `pricingUnit`.**


            Same rule and the same reason as `seatsOnNextDisplay`: a client
            deriving its own phrase is a second copy of a rule this API owns, and
            the copy that drifts is the one that misstates a price to a consumer.
            Money FORMATTING stays with the client — it already gets rupee
            grouping right; only the unit phrase is ours.
          examples: ["per person", "for the group"]
        heroMedia: { $ref: "#/components/schemas/Media" }
        operator: { $ref: "#/components/schemas/OperatorSummary" }
        nextAvailable:
          type: string
          format: date
          description: >-
            The next departure a traveller could actually book, as a date in
            the MARKET's timezone.


            **Absent means nothing is bookable in the next 90 days** — not "we
            did not check". A card that says nothing about availability makes
            the traveller tap through to find out, and the tap that ends in "no
            dates" is the one that loses them. Bounded at 90 days on purpose: an
            experience whose next departure is in March is not usable by
            somebody with three days on an island, and showing it as available
            wastes their tap.
        seatsOnNext:
          type: integer
          description: >-
            Seats left on that departure. Present only alongside
            `nextAvailable`, and **only for `allotment` mode** — a request-mode
            departure holds nothing until an operator says yes, so a number here
            would be a promise we cannot keep, and "3 seats left" that becomes
            "the operator declined" is worse than saying nothing.
        seatsOnNextDisplay:
          type: string
          description: >-
            That number as a sentence, decided here. **Render it verbatim; do
            not re-derive one from `seatsOnNext`.**


            The card was printing "N seats left" below a threshold it kept
            itself, which is a second copy of a rule the server owns. The moment
            the threshold moves — or counts start being suppressed — the card
            and the slot row disagree about the same departure.


            Absent means say nothing about availability. Same semantics as
            `Slot.remainingDisplay`, and the same function computes both.
          examples: ["3 seats left"]

    BookingMode:
      type: string
      description: >-
        How this experience sells. `allotment` means Yuvoy holds contracted
        seats and a traveller books instantly. `request` means the operator
        answers first and the traveller pays only after they accept — Yuvoy
        holds no inventory and makes no availability claim.
      enum: [allotment, request]

    Experience:
      allOf:
        - $ref: "#/components/schemas/ExperienceSummary"
        - type: object
          required: [gallery, meetingPoint, bookable]
          properties:
            bookable:
              type: boolean
              description: >-
                Whether this listing can be sold right now: the operator is
                selling, the listing is published and priced, no kill switch
                applies, and every credential its market and activity category
                require is on file, verified and unexpired today.


                **`false` is a 200, not a 404.** The card is already absent from
                every browse surface, so the only way to reach this page is a
                link somebody was handed — a shared message, a bookmark, a
                search result — and telling that person the business does not
                exist is worse than telling them it is not selling. Availability
                comes back empty for the same listing, and a checkout attempt is
                refused with `operator_not_bookable`.


                Deliberately carries **no reason**. Why a business has stopped
                selling is a supply judgment about them and is not published on
                a traveller endpoint.
            summary: { type: string }
            description: { type: string }
            included:
              type: array
              items: { type: string }
            # What the day asks of the traveller — fitness, swimming, prior
            # certification. Shown before anyone commits, not at the jetty.
            requirements:
              type: array
              items: { type: string }
            safetyNotes: { type: string }
            policyTier: { $ref: "#/components/schemas/PolicyTier" }
            cancellationPolicy:
              type: string
              description: The policy as it will be frozen onto a booking at checkout.
            meetingPoint: { $ref: "#/components/schemas/MeetingPoint" }
            gallery:
              type: array
              items: { $ref: "#/components/schemas/Media" }
            safety: { $ref: "#/components/schemas/SafetyRequirements" }
            questions:
              type: array
              description: >-
                What the operator asks every traveller on this listing, in the
                order to ask it. Absent when the listing asks nothing. Send the
                answers with the reservation as `answers`, or from the booking
                link afterwards with `POST /bookings/answers`. A checkout that
                sends `answers` must answer every question with
                `required: true`; one that sends none is never refused over a
                question. Never about health, which is `safety.screener`.
              items: { $ref: "#/components/schemas/ListingQuestion" }

    MeetingPoint:
      type: object
      required: [text]
      properties:
        text: { type: string }
        landmark: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }

    ExperiencePage:
      type: object
      required: [items, nextCursor, complete]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ExperienceSummary" }
        nextCursor:
          # OpenAPI 3.1 drops `nullable`; a null union is the 3.1 spelling.
          type: [string, "null"]
        complete:
          type: boolean
          description: >-
            Whether this is the end. **Told, not inferred.** A client that
            decides it has reached the end because a page came back short stops
            early the first time a filter happens to return exactly one page —
            and an infinite scroll that silently stops looks identical to one
            with nothing more to show.

    Slot:
      type: object
      required:
        [id, startsAt, endsAt, marketTimezone, localDate, localStartTime, bookingCutoffAt, status, bookingMode, soldOut]
      properties:
        id: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        marketTimezone:
          type: string
          description: IANA zone the local fields are expressed in, e.g. Asia/Kolkata.
          examples: ["Asia/Kolkata"]
        localDate: { type: string, format: date }
        localStartTime: { type: string, examples: ["07:00:00"] }
        bookingCutoffAt:
          type: string
          format: date-time
          description: After this instant the slot cannot be booked. Shown disabled, never hidden.
        status: { type: string, enum: [open, closed, cancelled] }
        bookingMode: { $ref: "#/components/schemas/BookingMode" }
        maxPartySize: { type: integer }
        price: { $ref: "#/components/schemas/Money" }
        # Present ONLY for allotment slots that are NOT stale.
        #
        # A request-mode slot carries no seat count because Yuvoy holds no
        # inventory on it — publishing a number there would be claiming
        # availability we do not have. A stale slot carries none because the
        # number is the thing that went stale; the departure did not.
        remainingSeats:
          type: integer
          description: >-
            Seats remaining after holds and bookings — the same arithmetic
            checkout enforces, not the contracted allotment. Absent for request
            mode and absent when `availability.stale` is true.
        remainingDisplay:
          type: string
          description: >-
            What to show the traveller, and the only field a UI should render
            for availability. Render this string; do not re-derive it from
            `remainingSeats`, or the two disagree the moment either rule
            changes.


            For allotment: `Full` at zero, an exact count from 1 to 5, and
            **`Available` at six or more** — a counter that reads 23, then 21,
            then 22 as holds come and go teaches a traveller the number is
            noise, so it appears only when it changes what somebody does. A
            stale slot reads `Available` too, except a full one, which stays
            `Full`: if our best information says there is no room we do not
            invite somebody into a checkout that will refuse them.


            For request mode: wording that promises an answer, never a seat.
        availability: { $ref: "#/components/schemas/SlotAvailability" }
        soldOut:
          type: boolean
          description: >-
            True when nobody more can book, or ask for, this departure. **Grey
            the departure out in a date picker on this field**, in both booking
            modes, rather than deriving it from `remainingSeats` or
            `remainingDisplay`.


            Allotment: no seat is left after holds and bookings, the same fact
            `remainingDisplay` states as `Full`. It stays true on a stale slot,
            for the same reason `Full` does.


            Request: the operator has already granted the departure's full
            capacity, so no further request could be accepted. Only the boolean
            is published. Request mode withholds seat counts on purpose, and
            this field does not change that.


            It says nothing about `status` or `bookingCutoffAt`. A departure
            that is `closed`, `cancelled` or past its cutoff is unbookable too
            and should be shown disabled on those fields, with `soldOut` possibly
            false.

    SlotAvailability:
      type: object
      required: [asOf, stale]
      properties:
        asOf:
          type: string
          format: date-time
          description: When a human last confirmed this seat count with the operator.
        verifiedVia:
          type: string
          enum: [manifest_call, operator_message, operator_portal, ops_correction]
        stale:
          type: boolean
          description: >-
            True when nobody has confirmed this seat count with the operator in
            over 24 hours.


            **Two thresholds, not one.** Past 24 hours the slot is still offered
            — the departure is real and the operator is reachable — but
            `remainingSeats` is withheld and `remainingDisplay` reads
            `Available`, so a day-old figure is never printed as a current one.
            Past the slot's suppression window (default 48 h) it is not returned
            at all and is counted in `staleSlotsSuppressed` instead.


            A UI seeing `stale: true` should say when the count was last checked
            — `asOf` and `verifiedVia` are there for exactly that — rather than
            silently showing less information.

    AvailabilityPage:
      type: object
      required: [slots, bookable, availabilityAsOf, marketTimezone, staleSlotsSuppressed]
      properties:
        slots:
          type: array
          items: { $ref: "#/components/schemas/Slot" }
        bookable:
          type: boolean
          description: >-
            The listing-level answer, identical to `Experience.bookable`. When
            it is `false` the response is still a 200 with an EMPTY `slots`
            array rather than a 404, so "this is not on sale" and "nothing is on
            between those dates" stay distinguishable to a client.


            Note that a slot can also disappear from a range while `bookable` is
            `true`: a credential lapsing mid-range removes the departures after
            it and leaves the ones before it. Those are dropped silently and are
            NOT counted in `staleSlotsSuppressed` — a counter there would
            publish the date an operator's insurance runs out.
        availabilityAsOf: { type: string, format: date-time }
        marketTimezone: { type: string, examples: ["Asia/Kolkata"] }
        staleSlotsSuppressed:
          type: integer
          description: >-
            How many slots were withheld as stale. Reported rather than hidden,
            so an empty day is distinguishable from an unverified one.

    ReservationInput:
      type: object
      required: [slotId, guests, contact]
      additionalProperties: false
      properties:
        slotId: { type: string }
        guests: { type: integer, minimum: 1 }
        contact: { $ref: "#/components/schemas/ReservationContact" }
        expectTotalPaise:
          type: integer
          format: int64
          description: >-
            The total the traveller was shown, in paise, for this party size.


            **Optional, and send it.** Omitted, nothing is checked and this
            endpoint behaves exactly as it always has. Sent, the checkout is
            refused `409 price_moved` when the listing no longer costs that.


            It exists because an operator now changes their own price with no
            review (D-032.3). That used to take days, so the gap between reading
            a total and pressing the button could not matter; it is now however
            long a checkout screen sits open. The price snapshot is taken from
            the LIVE listing inside the checkout transaction, so without this a
            traveller is charged the new number having agreed to the old one —
            and the snapshot records the new number as what they agreed to.


            Trusted, unlike `attribution`, and safely: the worst a wrong value
            can do is refuse a booking that would have overcharged whoever sent
            it.
        attribution: { $ref: "#/components/schemas/Attribution" }
        screening: { $ref: "#/components/schemas/Screening" }
        answers:
          type: array
          description: >-
            Answers to the questions this listing asks (`questions` on the
            experience).


            **Optional.** Omit it and nothing about questions is checked, the
            listing's required ones included: the booking reads each question
            as not answered yet, to be answered with `POST /bookings/answers`.


            **Send it, even as an empty list, and required questions are
            enforced.** The checkout is refused `409 answers_required` when a
            question the listing asks now with `required: true` has no answer
            here that fits, and `details.questions` names each one. `null`, or
            a value that is not a list, counts as not sent.


            An answer that does not fit is not recorded, and never refuses the
            checkout on its own: it only leaves its question unanswered. Not
            fitting means a question the listing no longer asks, a choice that
            is not one of its options, an answer its question's type does not
            take, or an item that is not an object with a string `questionId`
            and a string `answer`. See what was recorded on
            `GET /bookings/status`, and answer the rest with
            `POST /bookings/answers`.


            A retry that replays an existing reservation records nothing new;
            answer from the booking link instead.


            Answers are kept for 90 days after the departure ends, and then
            deleted, as `PartyQuestion` describes.
          items: { $ref: "#/components/schemas/BookingAnswer" }

    SafetyRequirements:
      type: object
      description: >-
        What this listing asks before it will take money. Carried here rather
        than behind a second call, because it decides how the booking form
        renders and a round trip on that screen costs bookings.


        This is what a client needs in order to ASK correctly. It enforces
        nothing — a client that ignores it gets a refusal from
        `POST /reservations`.
      properties:
        minAge:
          type: integer
          description: >-
            The operator's stated minimum age. Absent means no age rule. When
            present, collect an age BAND per participant — never a date of
            birth, which is personal data gathered for a comparison that does
            not need it.
        screener:
          type: object
          description: The health declaration this listing requires. Absent means none.
          required: [key, version, questions, affirmation]
          properties:
            key: { type: string, example: diving_rstc }
            version:
              type: integer
              description: >-
                The version a declaration will be recorded against. A screener
                revised on medical advice does not retroactively restate what
                somebody was already asked.
            questions:
              type: array
              items: { type: string }
              description: >-
                Render from here, in order. Not hardcoded in the client: the
                list changes on medical advice, and a copy in a frontend build
                is a copy that goes stale silently.
            affirmation:
              type: string
              description: >-
                The single statement the lead traveller ticks, covering the
                whole party — which is what the copy tells them they are doing.

    ListingQuestion:
      type: object
      additionalProperties: false
      description: >-
        One question the operator asks every traveller on a listing. Its `text`,
        `answerType` and `options` never change once it exists: a reworded
        question comes with a new `id`. Never about health, which the screener
        asks.
      required: [id, text, answerType, required]
      properties:
        id:
          type: string
          description: What an answer names in `questionId`.
        text:
          type: string
          maxLength: 200
          description: The question, to show as it is.
        answerType:
          type: string
          enum: [short_text, choice, yes_no]
          description: >-
            How to ask it. `short_text` takes up to 300 characters, `choice`
            takes exactly one of `options`, and `yes_no` takes `yes` or `no`.
        options:
          type: array
          items: { type: string }
          description: The choices, in the order to show them. Present only on a `choice` question.
        required:
          type: boolean
          description: >-
            The operator needs an answer. Show it as needed. A checkout that
            sends `answers` is refused `409 answers_required` until this
            question has an answer that fits; a checkout that sends no `answers`
            is not, and the traveller can answer from the booking link
            afterwards.

    PartyQuestion:
      type: object
      additionalProperties: false
      description: >-
        One question as it stands for this party: the words they were asked, and
        their answer if they gave one. Every question the listing asks now comes
        first, in the listing's order, answered or not. After them comes any
        question this party answered that the listing no longer asks, with
        `current: false`, so an earlier answer stays readable with its words.


        Answers are kept for 90 days after the departure ends, and then deleted,
        unless a legal hold names this booking (D46). Afterwards every question
        the listing still asks reads `answered: false`, with no `answer` or
        `answeredAt`, exactly as a question never answered reads, and a question
        the listing no longer asks is not listed at all.
      required: [questionId, text, answerType, required, current, answered]
      properties:
        questionId: { type: string }
        text:
          type: string
          description: >-
            The words this party was asked. They never change once a question
            exists, so on an answered question these are the words answered.
        answerType: { type: string, enum: [short_text, choice, yes_no] }
        options:
          type: array
          items: { type: string }
          description: Present only on a `choice` question.
        required: { type: boolean }
        current:
          type: boolean
          description: >-
            `false` when the listing no longer asks this question. Only an
            answered question appears with `current: false`, and it cannot be
            answered again.
        answered:
          type: boolean
          description: "`false` means no answer is on record: not answered yet, or deleted 90 days after the trip."
        answer:
          type: string
          description: >-
            Present when answered: `yes` or `no`, one of `options` as the
            listing wrote it, or the traveller's own words.
        answeredAt: { type: string, format: date-time }

    BookingAnswer:
      type: object
      additionalProperties: false
      required: [questionId, answer]
      properties:
        questionId:
          type: string
          description: The `id` of one of the listing's `questions`.
        answer:
          type: string
          maxLength: 300
          description: >-
            `yes` or `no` for a `yes_no` question, one of `options` for a
            `choice` question, and up to 300 characters for `short_text`.

    BookingAnswersInput:
      type: object
      additionalProperties: false
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/BookingAnswer" }

    Screening:
      type: object
      additionalProperties: false
      description: >-
        The two safety gates, both enforced when the reservation is created
        rather than checked at the jetty. Read `safety` on the experience detail
        to know whether this listing asks for either.


        **A declared condition takes no money and holds no seat.** The whole
        transaction rolls back: no hold, no payment order, nothing to refund. A
        refund afterwards is worse for everybody than a conversation beforehand,
        and somebody who has already paid is somebody who will argue to be
        allowed in the water — which puts the operator in the position of
        refusing a paying customer at the jetty.
      properties:
        declaredClear:
          type: boolean
          description: >-
            The lead traveller's answer to the whole screener, on behalf of the
            party. **Omitted is not `false`** — a listing that asks and receives
            nothing answers `400 screening_required`, because a default here is
            an answer nobody gave. `false` answers `409
            screening_needs_a_doctor` and books nothing.


            Only the boolean, the screener version and a timestamp are stored.
            No conditions, no names, no free text — which is what lets that
            record be unencrypted. The per-diver medical form is a separate,
            encrypted thing taken privately before the dive.
        ageBands:
          type: array
          description: >-
            One band per participant, in party order, required when the listing
            states a `minAge`. A band rather than a date of birth: a band is
            enough to enforce a minimum age and is not identifying.


            Checked against the FLOOR of the band. Somebody in `12_14` could be
            12, so a 14+ experience refuses them — comparing the top of the band
            would admit exactly the person the rule exists to stop.
          items:
            type: string
            enum: [under_10, 10_11, 12_14, 15_17, 18_plus]

    Attribution:
      type: object
      additionalProperties: false
      description: >-
        Where this checkout came from. Optional, client-claimed, and trusted for
        nothing — it decides no price, no eligibility and no permission, which is
        what makes accepting it from an anonymous caller safe. A client that lies
        here corrupts only its own marketing numbers.


        Frozen at checkout alongside the price and the policy, and inherited by
        the booking at capture rather than re-read. At capture the traveller is
        arriving back from a payment provider's redirect, so anything read then
        would attribute every booking to the provider.


        Sent as part of the request body, so it is covered by the idempotency
        fingerprint: a retry that changes it is refused rather than silently
        re-attributing a booking that already exists.
      properties:
        source:
          type: string
          enum: [qr, direct, search, social, referral, operator, web, unknown]
          description: >-
            Anything outside this set is stored as `unknown` rather than
            rejected — a checkout must not fail over a marketing field.


            `web` is **our own marketing site**, and is deliberately not
            `referral`, which means somebody else's site, nor `direct`, which
            means the address was typed. A person who read `yuvoy.in` and tapped
            through did neither, and filing them under either name makes the
            funnel unreadable a quarter later.
        placement:
          type: string
          maxLength: 120
          description: Which card, which boat, which door.
        campaign: { type: string, maxLength: 120 }
        scanCode:
          type: string
          maxLength: 32
          description: >-
            The printed code they arrived from, if any. The code, not a scan id:
            an id the client keeps and sends back is exactly the correlatable
            token POST /scans refuses to mint.
        landingPath:
          type: string
          maxLength: 256
          description: >-
            First page of the visit. The checkout path is not accepted here — we
            already know it for certain, and asking for a fact we hold is how the
            two come to disagree.

    ReservationContact:
      type: object
      # Name and a WhatsApp number, and nothing else required. Minimal by
      # design: it is what puts someone on a boat and tells them where to be,
      # and every extra field costs conversions on the one funnel there is.
      #
      # Not listed in `required` since 2026-09-13, because a signed-in checkout
      # may leave both out (see createReservation). A guest checkout still must
      # send both, and is refused with a 400 naming the field when it does not.
      description: >-
        `name` and `whatsapp` are required for a guest checkout. Signed in with a
        travellerSession, both may be omitted and `whatsapp` is ignored.
      properties:
        name:
          type: string
          maxLength: 120
          description: Required for a guest. Signed in, defaults to the profile name, then the newest booking's name.
        whatsapp:
          type: string
          description: "E.164, e.g. +919000000000. Required for a guest. Ignored when signed in: the session's number is used."
        email: { type: string, description: "Optional. Signed in and left out, the profile email is used when there is one." }
        marketingConsent:
          type: boolean
          description: >-
            A separate, unticked question at checkout. **Omit it if you did not
            ask** — absent and `false` mean different things and both are
            recorded as such.


            absent = never asked · `false` = asked and declined · `true` =
            asked and agreed.


            Collapsing absent into `false` would make every client that omits
            the field look like a refusal, and would erase the difference
            between "we never asked" and "they said no" — which is precisely
            the question a DPDP request asks of us.


            The moment it was given is recorded server-side from the database
            clock, never from anything you send: a consent record whose date
            the caller chooses is not evidence.


    Reservation:
      type: object
      required: [reservationId, state, guests]
      properties:
        reservationId: { type: string }
        state:
          type: string
          enum: [pending_request, active]
          description: >-
            `active` holds seats until `holdExpiresAt`. `pending_request` holds
            none and waits on the operator until `requestExpiresAt`.
        guests: { type: integer }
        holdExpiresAt:
          type: [string, "null"]
          format: date-time
          description: Set for allotment holds only.
        requestExpiresAt:
          type: [string, "null"]
          format: date-time
          description: Set for operator requests only.
        statusToken:
          type: string
          description: >-
            Returned exactly once. Only its hash is stored; it cannot be
            recovered afterwards. Carry it in a URL fragment, never a path or
            query — this API logs request URIs.

    PaymentOrder:
      type: object
      required: [state, orderId, providerOrderId, provider, amountPaise, currency, expiresAt]
      properties:
        state:
          type: string
          enum: [ready]
          description: >-
            Always `ready` on a 201. Present so a client switches on one field
            across both responses rather than inferring from the status code.
        orderId: { type: string, description: Ours. }
        providerOrderId:
          type: string
          description: >-
            The provider's own order id, for their checkout widget.
        provider: { type: string }
        amountPaise:
          type: integer
          description: >-
            INR paise. Integer — there are no fractional paise.
        currency: { type: string }
        expiresAt:
          type: string
          format: date-time
          description: >-
            The hold's deadline, not a separate payment clock. Paying after it
            may still succeed — the capture re-acquires capacity — but the seat
            is no longer reserved and the booking can be declined with a full
            automatic refund.
        payAtCounter:
          description: >-
            Present **alongside** a live payment order, not only in its absence.
            On a jetty in the Andamans cash is not a fallback for when the card
            machine is broken; it is how people pay, and a traveller with no card
            or no signal at the moment they decide is not an edge case.


            Absent means cash is not on offer for this reservation. Offer it as a
            real second choice rather than hiding it behind the card flow.
          type: object
          required: [available, confirmAt]
          properties:
            available: { type: boolean }
            confirmAt:
              type: string
              description: >-
                Path to POST to, relative to the API base — the same path as
                `POST /reservations/{id}/cash-booking`, so it carries no `/v1` of
                its own.

    ReelItem:
      type: object
      description: >-
        One reel and the listing it sells: the item `GET /reels` pages, and
        what `GET /reels/{id}` returns.
      required: [media, experience]
      properties:
        media: { $ref: "#/components/schemas/Media" }
        experience: { $ref: "#/components/schemas/ExperienceSummary" }

    VocabularyTerm:
      type: object
      required: [key, label]
      properties:
        key: { type: string, description: What to send. }
        label: { type: string, description: What to show. }

    ActivityTypeTerm:
      type: object
      required: [key, label, category]
      properties:
        key: { type: string, examples: ["scuba"] }
        label: { type: string, examples: ["Scuba diving"] }
        category: { $ref: "#/components/schemas/Category" }

    ReelPage:
      type: object
      required: [items, complete]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              media: { $ref: "#/components/schemas/Media" }
              experience: { $ref: "#/components/schemas/ExperienceSummary" }
        complete:
          type: boolean
          description: >-
            Told rather than inferred. `false` with no `nextCursor` means the
            server stopped, which is a different thing from the grid having
            ended.
        nextCursor:
          type: string
          description: Absent when there is nothing after this page.

    OperatorProfile:
      type: object
      required:
        [id, slug, name, verified, bookable, listingCount, reelCount, listings, reels]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        verified:
          type: boolean
          description: >-
            True only when EVERY visible listing of theirs is — every mandatory
            credential on file, verified and unexpired. Stated across the
            business rather than per listing on purpose: an operator whose
            diving licence has lapsed must not collect a badge from a listing
            that needs no licence. A statement about evidence we hold, not a
            reputation score.
        bookable:
          type: boolean
          description: >-
            Whether anything of theirs can be bought right now. `false` is a
            real, renderable state — a business that has paused is still a
            business somebody was linked to, so render the page and say so.
        logoUrl:
          type: string
          description: >-
            Absent when they have not set one. Fall back to your own placeholder
            rather than rendering a broken image.
        about:
          type: string
          description: >-
            What this business says about itself, 40 to 600 characters. **Absent
            when they have not written one** — render nothing rather than an
            empty "About" heading, which on a trust surface reads as a business
            that could not be bothered rather than one that has not got to it.
        operatingSince:
          type: integer
          description: >-
            The year they started. Sits beside the verified badge and is read as
            something we checked, which is why an operator cannot restate it in
            place — it changes through review.
        languages:
          type: array
          description: >-
            What the crew speaks. On these islands it is often the deciding fact
            for a traveller who is nervous in the water.
          items: { type: string }
        findThemAt:
          type: string
          description: >-
            Where a traveller physically goes. **Not the registered address** —
            that is compliance data and is frequently an accountant's office on
            a different island. Also not the meeting point, which belongs to a
            listing and can differ per experience.
        photos:
          type: array
          description: >-
            Up to five photographs **of the operation** — the boat, the shop,
            the crew. Deliberately not the experience: that is what the reels
            are, and a gallery standing in for footage is the failure a
            video-first feed exists to prevent.
          items: { type: string }
        locations:
          type: array
          description: The destinations they run in, from their own listings.
          items: { type: string }
        listingCount: { type: integer }
        reelCount: { type: integer }
        listings:
          type: array
          items:
            type: object
            required: [experience, bookable]
            properties:
              experience: { $ref: "#/components/schemas/ExperienceSummary" }
              bookable:
                type: boolean
                description: >-
                  Per listing, and projected rather than filtered on: a listing
                  that has stopped selling says "not available" rather than
                  vanishing. Truer here than anywhere — somebody sent this link
                  is looking for a specific thing they saw.
        reels:
          allOf:
            - $ref: "#/components/schemas/ReelPage"
          description: The first screen of the grid. Page it at /operators/{slug}/reels.

    CashBooking:
      type: object
      required: [bookingReference, state, payAtCounterPaise, currency]
      properties:
        bookingReference:
          type: string
          description: >-
            `YV-XXXXXXXX`. The one thing the traveller has to be able to say out
            loud at a jetty, so the alphabet excludes the letters people mishear.
        state:
          type: string
          enum: [paid_pending_ops]
          description: >-
            Committed, and nobody has been paid yet. The booking holds the seat
            from this moment; the state changes to `confirmed` when the operator
            records taking the cash.
        payAtCounterPaise:
          type: integer
          description: >-
            What to bring, in INR paise. The price agreed at checkout, not a
            fresh read of the listing. Named for what the traveller does rather
            than for what our ledger calls it — this money never reaches us, so
            calling it an amount due would be wrong in both directions.
        currency: { type: string }

    BookingStatus:
      type: object
      required: [reservationId, state, final, guests, experience, slot, price, review]
      properties:
        reservationId: { type: string }
        state:
          type: string
          enum:
            - holding
            - awaiting_operator
            - expired
            - released
            - verifying
            - confirmed
            - declined
            - cancelled
            - completed
            - no_show
          description: >-
            Computed server-side from the reservation, fulfilment, payment and
            refund machines. Never stored, and never to be derived client-side.


            `verifying` means money may have moved and the outcome is not yet
            settled. **Never render it as failure** — "if money left your
            account it is safe" is the only honest copy for that window. It is
            also what the server says when a booking exists but is not yet
            visible: claiming a confirmed seat we cannot prove is the one thing
            this endpoint must never do.


            A **cash** booking reads `confirmed` as soon as it is made, never
            `verifying`: the seat was taken against a live hold and is the
            traveller's, and no money has moved to wait on. What they still owe
            the operator is in `payment` (D-034).


            `declined` means money was taken and the seat could not be
            delivered; a full refund is already recorded and `refund` carries
            where it is.
        final:
          type: boolean
          description: >-
            `true` when this state cannot change on its own — stop polling.
        holdExpiresAt:
          type: [string, "null"]
          format: date-time
          description: >-
            Present only while `state` is `holding`. Absent once the deadline is
            meaningless, so a countdown is never rendered beside a dead booking.
        guests: { type: integer }
        contactName:
          type: string
          description: >-
            The name given at checkout. The phone number and email are
            deliberately not returned: whoever holds this link is usually the
            person who supplied them, and "usually" is not an access rule.
        experience:
          type: object
          required: [slug, title, operator, operatorSlug, heroImageUrl]
          properties:
            slug: { type: string }
            title: { type: string }
            operator: { type: string }
            operatorSlug:
              type: string
              description: The business, for linking to its page.
            heroImageUrl:
              type: [string, "null"]
              format: uri
              description: >-
                The listing's headline picture, resolved as the catalog resolves
                `heroMedia`. `null` when the listing has none; always sent.
        slot:
          type: object
          required: [startsAt, timezone]
          properties:
            startsAt: { type: string, format: date-time }
            timezone:
              type: string
              description: IANA zone of the market, for rendering local time.
        price:
          type: object
          required: [totalPaise, currency]
          properties:
            totalPaise:
              type: integer
              description: >-
                From the price snapshot frozen at checkout, not the live
                listing — an operator editing a price cannot restate what this
                traveller agreed to.
            currency: { type: string }
        bookingReference:
          type: string
          description: >-
            Present once a booking exists. Human-quotable and **not a
            credential** — it goes on the operator's manifest and is read aloud
            on a jetty.
        meetingPoint:
          type: object
          description: >-
            Where the day starts. This is the screen a traveller opens on the
            morning of the trip and it was the one screen without it — both
            `/trips/{token}` and `/me/bookings` already carried it.
          properties:
            text: { type: string }
            landmark: { type: string }
        cancellation:
          type: object
          description: >-
            Why the trip is off. Present only when it is. The app was hedging
            with "if the sea called it off", which is a guess dressed as
            information and the wrong guess for anything cancelled otherwise.
          properties:
            reasonCode: { type: string }
        requestExpiresAt:
          type: string
          format: date-time
          description: >-
            When an unanswered request lapses — "answer by". Since 2026-09-13
            this is the departure's booking cutoff, which can be days away, so
            show it as a date and time rather than a countdown. The creation
            response carried this and the status page could not show it, so a
            traveller waiting had no idea how long for. Absent once the booking
            is final.
        operatorUpdates:
          type: array
          description: >-
            What the operator has told everybody on this departure — a time
            change, a meeting point, a weather watch. Absent when there are
            none; the key is omitted rather than sent empty.


            This is where a relay note lands. Free text an operator writes is
            shown HERE and never sent to a phone, so a traveller who is told
            "see your booking page" has somewhere to look.
          items:
            type: object
            required: [kind, from, sentAt]
            properties:
              kind:
                type: string
                enum: [time_change, meeting_point_change, weather_watch, bring_item, note]
                description: What sort of update this is.
              from:
                type: string
                description: >-
                  Who sent it: the business's display name. An update about
                  somebody's morning that appears from nobody is not reassuring.
              intent:
                type: string
                deprecated: true
                enum: [time_change, meeting_point_change, weather_watch, bring_item, note]
                description: >-
                  Never emitted. This document named the field `intent` while
                  the server has always sent `kind`; read `kind`.
              detail: { type: string }
              note: { type: string }
              sentAt: { type: string, format: date-time }
        payment:
          type: object
          required: [method, collected, amountPaise]
          description: >-
            Present only for a booking paid in cash at the counter: what the
            traveller still owes the operator, and whether it has been taken. A
            card booking carries no `payment`.


            Render it beside `confirmed` — the seat is booked, and this is what to
            bring on the day (D-034).
          properties:
            method:
              type: string
              enum: [cash]
            collected:
              type: boolean
              description: "`true` once the operator has recorded taking the cash."
            amountPaise:
              type: integer
              description: >-
                What to bring, from the price frozen at checkout — the same
                number as `price.totalPaise`.
        questions:
          type: array
          description: >-
            The questions this listing asks and what this party answered. Absent
            when the listing asks nothing and nothing was answered. A question
            with `answered: false` has no answer on record; answer it with
            `POST /bookings/answers` while `answersOpen` is `true`. Answers are
            deleted 90 days after the trip, as `PartyQuestion` describes, and
            `questions` is then absent if the listing no longer asks anything.
          items: { $ref: "#/components/schemas/PartyQuestion" }
        answersOpen:
          type: boolean
          description: >-
            Present with `questions`. `true` while `POST /bookings/answers` will
            take an answer: the booking is going ahead and its departure has not
            left. Told rather than inferred, so a form is never offered that
            would be refused.
        refund:
          type: [object, "null"]
          description: >-
            Present only when a refund exists, so the happy path carries no
            alarming vocabulary. Answers the only question a declined or
            cancelled traveller has: where is my money.
          properties:
            amountPaise: { type: integer }
            state:
              type: string
              enum: [requested, pending, failed, processed, reversed, abandoned]
            message:
              type: string
              description: Ready-to-render copy for the current refund state.
        support:
          allOf: [{ $ref: "#/components/schemas/SupportContact" }]
          description: >-
            How to reach a person, the same as on `getMyAccount`, so a traveller
            on a booking link who never signed in can still "Chat with us".
            Always sent (since 2026-09-13); `whatsappE164` is null while there is
            no support number, and the button is hidden then.
        review:
          type: object
          required: [reviewed, canReview]
          description: >-
            Whether to offer "how did it go". Always sent. `canReview` is true
            for a `completed` trip with no review that ended no more than 30
            days ago, which is exactly when `leaveReview` accepts one.
          properties:
            reviewed: { type: boolean }
            canReview: { type: boolean }
            rating:
              type: integer
              minimum: 1
              maximum: 5
              description: The stars given. Present only once reviewed.

    BookingMessage:
      type: object
      required: [id, from, senderName, sentAt]
      properties:
        id:
          type: string
          description: Send it as `upTo` to mark this message and everything before it read.
        from:
          type: string
          enum: [traveller, operator]
          description: "`traveller` is the person holding this link; `operator` is the business."
        senderName:
          type: string
          description: >-
            The name to show beside it: the name given at checkout on the
            traveller's messages, and the business's name on the business's.
        text:
          type: string
          description: >-
            What was written, trimmed, with its line breaks. Every message
            carries exactly one of `text` and `textRemovedAt`, and a message
            that was just sent always carries `text`.
        textRemovedAt:
          type: string
          format: date-time
          description: >-
            When the text was removed, a set time after the trip ended. Present
            only in place of `text`. Show the message as one whose text was
            removed, never as an empty message.
        sentAt: { type: string, format: date-time }

    BookingMessageThread:
      type: object
      required: [messages, complete, unreadCount, canWrite]
      properties:
        messages:
          type: array
          description: >-
            Oldest first within the page. The first page is the most recent
            messages.
          items: { $ref: "#/components/schemas/BookingMessage" }
        complete:
          type: boolean
          description: >-
            `true` when the conversation begins on this page. `false` always
            comes with a `nextCursor` for the messages before it.
        nextCursor:
          type: string
          description: Absent when nothing came before this page.
        unreadCount:
          type: integer
          description: Messages from the business the traveller has not marked read.
        canWrite:
          type: boolean
          description: Whether a message can be sent now.
        closedReason:
          type: string
          enum: [not_booked, cancelled, declined, window_closed]
          description: >-
            Present only when `canWrite` is `false`. `not_booked`: the link's
            hold or request never became a booking. `cancelled` and `declined`:
            the booking ended, and nothing reopens it. `window_closed`: the trip
            ended longer ago than messages stay open.
        writableUntil:
          type: string
          format: date-time
          description: >-
            When writing stops on its own, a set time after the trip ends.
            Present while the conversation is open and once that time has
            passed. Absent when there is no booking, or it was cancelled or
            declined.

    BookingMessageInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
          description: The message. Trimmed, with its line breaks kept.

    BookingMessageReadInput:
      type: object
      required: [upTo]
      properties:
        upTo:
          type: string
          description: The `id` of the last message that was shown.

    BookingMessageReadReceipt:
      type: object
      required: [unreadCount]
      properties:
        unreadCount:
          type: integer
          description: Messages from the business still unread after this.

    BookingInput:
      type: object
      required: [slotId, guests]
      properties:
        slotId: { type: string }
        guests: { type: integer, minimum: 1 }

    Booking:
      type: object
      required: [id, status, experienceSlug, slotId, guests, total, createdAt]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [pending_payment, confirmed, completed, cancelled, no_show]
        experienceSlug: { type: string }
        slotId: { type: string }
        guests: { type: integer }
        total: { $ref: "#/components/schemas/Money" }
        createdAt: { type: string, format: date-time }

    WaitlistInput:
      type: object
      required: [email]
      properties:
        name: { type: string, maxLength: 80 }
        email: { type: string, format: email }
        source: { type: string }

    WaitlistEntry:
      type: object
      required: [id, email, createdAt]
      properties:
        id: { type: string }
        email: { type: string }
        createdAt: { type: string, format: date-time }

    # ---- Pre-launch lead capture -------------------------------------------
    # Geography is deliberately generic. `marketKey` names a launch market and
    # a destination key is "<market>/<destination>". Andaman is the first
    # market, not the schema's boundary.

    LeadAudience:
      type: string
      description: >
        Which side of the marketplace the contact is. `provider` matches the
        existing `User.role` and `Provider` vocabulary in this contract.
      enum: [traveller, provider]

    MarketKey:
      type: string
      description: Launch market. Extensible; `andaman` is simply the first.
      pattern: "^[a-z][a-z0-9_]*$"
      example: andaman

    DestinationKey:
      type: string
      description: A destination within a market, as `<market>/<destination>`.
      pattern: "^[a-z][a-z0-9_]*/[a-z][a-z0-9_]*$"
      example: andaman/havelock

    InterestGroup:
      type: string
      enum: [diving_water, boats_islands, food_culture, other]

    LeadSource:
      type: string
      description: Where the visitor arrived from. Campaign routes set this.
      enum: [ferry, kiosk, hotel, instagram, direct, web]
      default: web

    Utm:
      type: object
      description: Campaign attribution. Never treated as identifying data.
      properties:
        source: { type: string, maxLength: 120 }
        medium: { type: string, maxLength: 120 }
        campaign: { type: string, maxLength: 120 }
        content: { type: string, maxLength: 120 }
        term: { type: string, maxLength: 120 }
      additionalProperties: false

    LeadInputBase:
      type: object
      required: [audience, contactName, privacyAccepted, marketKey]
      description: >
        Contact rule (enforced server-side): every lead, whichever audience,
        must supply at least one of `whatsapp` or `email`. Providers were
        previously required to give `whatsapp`; that requirement is gone,
        because some operators will not hand a personal mobile number to a
        pre-launch platform and requiring one loses the application entirely.

        Deduplication uses the normalised contact — WhatsApp number when
        present, else email — so a provider identified only by email
        deduplicates on that address.
      properties:
        audience: { $ref: "#/components/schemas/LeadAudience" }
        contactName: { type: string, minLength: 1, maxLength: 120 }
        whatsapp:
          type: string
          description: Normalised to E.164 server-side.
          maxLength: 32
          example: "+919000000000"
        email: { type: string, format: email, maxLength: 254 }
        privacyAccepted:
          type: boolean
          description: Must be true. Acknowledges the Privacy Policy and Terms.
          const: true
        marketingOptIn:
          type: boolean
          description: Separate, optional, unchecked by default.
          default: false
        marketKey: { $ref: "#/components/schemas/MarketKey" }
        source: { $ref: "#/components/schemas/LeadSource" }
        utm: { $ref: "#/components/schemas/Utm" }
        website:
          type: string
          description: >
            Honeypot. Left empty by real visitors; a non-empty value is handled
            server-side and never becomes an actionable lead.
          maxLength: 255

    TravellerLeadInput:
      allOf:
        - $ref: "#/components/schemas/LeadInputBase"
        - type: object
          description: >
            Deliberately minimal — the public waitlist asks for a name and one
            way to reach you, nothing more. Destination and interests are
            optional attribution (campaign routes may set a destination
            default); they are never required of the visitor.
          properties:
            audience: { const: traveller }
            primaryDestinationKey:
              { $ref: "#/components/schemas/DestinationKey" }
            interests:
              type: array
              maxItems: 3
              uniqueItems: true
              items: { $ref: "#/components/schemas/InterestGroup" }

    ProviderLeadInput:
      allOf:
        - $ref: "#/components/schemas/LeadInputBase"
        - type: object
          required: [businessName]
          description: >
            Only the business name is required beyond the base. Where an
            operator works and what they offer are collected in the onboarding
            conversation instead, so the form need not ask: the site now
            invites operators outside the launch market, who have no truthful
            option to select from a destination list scoped to it.

            `coverageDestinationKeys` and `primaryInterest` remain accepted and
            are persisted unchanged when sent — existing clients are not
            broken, and an internal tool may still supply them. A resubmission
            that omits them does not erase values an earlier one provided.
          properties:
            audience: { const: provider }
            businessName: { type: string, minLength: 1, maxLength: 160 }
            coverageDestinationKeys:
              type: array
              maxItems: 24
              uniqueItems: true
              items: { $ref: "#/components/schemas/DestinationKey" }
            primaryInterest: { $ref: "#/components/schemas/InterestGroup" }

    LeadInput:
      oneOf:
        - $ref: "#/components/schemas/TravellerLeadInput"
        - $ref: "#/components/schemas/ProviderLeadInput"
      discriminator:
        propertyName: audience
        mapping:
          traveller: "#/components/schemas/TravellerLeadInput"
          provider: "#/components/schemas/ProviderLeadInput"

    LeadAcceptance:
      type: object
      description: >
        Deliberately minimal. It confirms the lead was recorded and carries no
        queue position, priority, or follow-up guarantee.
      required: [id, audience, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        audience: { $ref: "#/components/schemas/LeadAudience" }
        status:
          type: string
          enum: [recorded, updated]
        createdAt: { type: string, format: date-time }

    MessageTopic:
      type: string
      description: >
        What the message is about. These are stable slugs, not the labels the
        form shows, so wording can change without splitting a category's
        history.
      enum: [general, feedback, listing, partnership]

    MessageInput:
      type: object
      description: >
        A message from the public contact form. It asks for one contact
        channel — an email address — because that is where a reply goes; it
        never asks for a phone number.

        There is no marketing opt-in here, by design. A message is used to
        answer the person who sent it, and nothing else; it never joins a
        marketing list.
      required: [name, email, topic, message]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email:
          type: string
          format: email
          maxLength: 254
          description: The only contact field. Normalised to lowercase server-side.
        topic: { $ref: "#/components/schemas/MessageTopic" }
        message: { type: string, minLength: 1, maxLength: 4000 }
        source: { $ref: "#/components/schemas/LeadSource" }
        website:
          type: string
          description: >
            Honeypot, with the same contract and the same server-side handling
            as `LeadInputBase.website`. Left empty by real visitors; a
            non-empty value is acknowledged normally and never becomes an
            actionable message.
          maxLength: 255
      additionalProperties: false

    MessageAcceptance:
      type: object
      description: >
        Deliberately minimal. It confirms the message was received and carries
        no reply-time promise, because the site publishes none.
      required: [id, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [received]
        createdAt: { type: string, format: date-time }

    LeadStatus:
      type: string
      description: >
        Internal follow-up lifecycle for a lead, tracked ops-side only. It is
        never accepted on a request and never returned in `LeadAcceptance` —
        a visitor's submission carries no signal about how their registration
        is being worked. Documented here for the internal ops tooling that
        reads and updates it directly against the database; no public
        endpoint reads or writes this value yet.
      enum: [new, contacted, qualified, disqualified]
      default: new
